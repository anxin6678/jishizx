<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Labs - Secure Terminal v1.04</title>
  <!-- ARG 细节 1：在源代码注释里放置隐蔽线索 -->
  <!-- 
      [SECURITY NOTICE]: 
      Emergency protocol activated. 
      If system resets, recovery password is: "VOID-1998"
      Do not leak this code to unauthorized users.
  -->
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    #console {
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid #00ff66;
      padding: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    .input-line {
      display: flex;
      margin-top: 10px;
    }
    .prompt {
      margin-right: 10px;
    }
    input {
      background: transparent;
      border: none;
      color: #00ff66;
      font-family: inherit;
      font-size: 1rem;
      flex: 1;
      outline: none;
    }
    .glitch {
      text-shadow: 2px 0 red, -2px 0 blue;
    }
  </style>
</head>
<body>

  <div id="console">
[SYSTEM INITIALIZED...]
[WARNING]: Unverified connection detected.
Welcome to Aethelgard Research Terminal.
Type 'help' to display available commands.
--------------------------------------------------
  </div>

  <div class="input-line">
    <span class="prompt">guest@aethelgard:~$</span>
    <input type="text" id="userInput" autofocus autocomplete="off">
  </div>

  <script>
    const output = document.getElementById('console');
    const input = document.getElementById('userInput');

    const commands = {
      'help': '可用指令:\n  help    - 显示帮助菜单\n  about   - 关于实验室\n  logs    - 查看公开日志\n  access  - 尝试系统鉴权 (用法: access <password>)',
      'about': 'Aethelgard Labs (1994-1998)\n专注于意识数字孪生研究。本项目已封存。',
      'logs': '日志 001: 实验体 Alpha 表现异常。\n日志 002: 实验室准备撤离。\n提示：尝试检查网页的底层秘密...',
    };

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        const val = input.value.trim();
        appendOutput(`guest@aethelgard:~$ ${val}`);
        
        const args = val.split(' ');
        const cmd = args[0].toLowerCase();
        const param = args[1];

        if (cmd === 'access') {
          if (param === 'VOID-1998') {
            appendOutput('\n[权限验证成功]\n正在重定向至核心档案页...\n>>> 获得下一关线索网址: ./stage2-core.html');
          } else {
            appendOutput('\n[拒绝访问]: 密码错误。请检查系统隐藏注释或底层文件。');
          }
        } else if (commands[cmd]) {
          appendOutput(commands[cmd]);
        } else if (val !== '') {
          appendOutput(`未知的指令: ${val}. 输入 'help' 查看指令集。`);
        }

        input.value = '';
        output.scrollTop = output.scrollHeight;
      }
    });

    function appendOutput(text) {
      output.innerText += '\n' + text;
    }
  </script>
</body>
</html>
