<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 多人视频与屏幕共享聊天室</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); max-width: 1000px; margin: 0 auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h3 { margin-top: 0; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; border: none; border-radius: 5px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        button.danger { background: #dc3545; }
        button.success { background: #28a745; }
        button.warning { background: #ffc107; color: #000; }
        
        /* 视频网格布局 */
        #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 10px; }
        .video-wrapper { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; }
        
        /* 聊天室布局 */
        #chat-box { height: 250px; border: 1px solid #eee; border-radius: 5px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 8px; line-height: 1.4; }
        .msg.me { color: var(--primary); text-align: right; }
        .msg.peer { color: #d63384; }
        .msg.system { color: #6c757d; font-size: 0.9em; text-align: center; font-style: italic; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎥 P2P 视频会议室</h1>
        <p>你的通讯 ID: <strong id="my-id" style="color: var(--primary); user-select: all; font-size: 1.2em;">生成中...</strong></p>
        
        <div class="flex">
            <button id="btn-camera" class="danger">1. 开启摄像头与麦克风 (必须先开启)</button>
            <button id="btn-screen" class="warning" style="display: none;">💻 共享屏幕</button>
        </div>
    </div>

    <div class="card">
        <h3>🔗 连接好友</h3>
        <div class="flex">
            <input type="text" id="target-id" placeholder="输入朋友的 ID 进行连接...">
            <button id="btn-connect" onclick="connectToPeer()">2. 连接并呼叫</button>
        </div>
    </div>

    <div class="card">
        <h3>📺 视频画面</h3>
        <div id="video-grid">
            <div class="video-wrapper">
                <video id="local-video" autoplay playsinline muted></video>
                <div class="video-label">我 (本地)</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>💬 聊天室 (<span id="active-peers-count">0</span> 人已连接)</h3>
        <div id="chat-box"></div>
        <div class="flex">
            <input type="text" id="msg-input" placeholder="输入文字消息..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let myId = '';
        let localStream = null;      // 本地音视频流
        let screenStream = null;     // 屏幕共享流
        
        const dataConns = {}; 
        const mediaCalls = {}; 

        const chatBox = document.getElementById('chat-box');
        const videoGrid = document.getElementById('video-grid');
        const localVideo = document.getElementById('local-video');

        // 1. 初始化连接
        peer.on('open', (id) => {
            myId = id;
            document.getElementById('my-id').innerText = id;
            logSystem('已连接到网络，可以开始通讯。');
        });

        // 2. 开启摄像头与麦克风
        document.getElementById('btn-camera').addEventListener('click', async () => {
            try {
                // 请求视频和音频权限
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream; // 本地显示自己的画面
                
                const btn = document.getElementById('btn-camera');
                btn.className = 'success';
                btn.innerText = '摄像头/麦克风已开启 ✅';
                document.getElementById('btn-screen').style.display = 'inline-block'; // 显示屏幕共享按钮
                logSystem('摄像头已就绪。');
            } catch (err) {
                alert('无法访问摄像头/麦克风，请检查浏览器权限。');
                console.error(err);
            }
        });

        // 3. 屏幕共享切换逻辑
        document.getElementById('btn-screen').addEventListener('click', async () => {
            if (!localStream) return alert('请先开启摄像头建立基础连接！');
            
            try {
                // 请求屏幕共享权限
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenVideoTrack = screenStream.getVideoTracks()[0];

                // 将
