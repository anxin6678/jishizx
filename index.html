<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Discord Mobile - 自定义头像版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dcChat: '#313338',
                        dcBgDark: '#1e1f22',
                        dcPanel: '#2b2d31',
                        dcNav: '#111214',
                        dcBlurple: '#5865f2',
                        dcGreen: '#23a55a',
                        dcRed: '#f23f43',
                        dcInput: '#383a40',
                        dcTextMuted: '#949ba4'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .discord-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .discord-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .discord-scrollbar::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 99px; }
        html, body { position: fixed; width: 100%; height: 100dvh; overflow: hidden; top: 0; left: 0; }
    </style>
</head>
<body class="h-dvh w-screen flex overflow-hidden select-none antialiased">

    <div id="login-overlay" class="fixed inset-0 bg-dcBgDark z-50 flex flex-col items-center justify-center p-6 pb-12">
        <div class="w-full max-w-sm text-center">
            <div class="inline-block p-4 bg-dcBlurple rounded-2xl shadow-xl shadow-dcBlurple/20 mb-5">
                <i class="fa-brands fa-discord text-4xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-1">自定义个人资料</h2>
            <p class="text-dcTextMuted text-xs mb-6">顺畅通过大陆网络进入全员 P2P 通讯大厅</p>
            
            <div class="bg-dcPanel rounded-2xl p-5 border border-black/20 shadow-lg mb-6 text-left">
                <label class="text-[10px] font-bold text-dcTextMuted uppercase tracking-wider block mb-2">大厅昵称</label>
                <input id="username-input" type="text" placeholder="不填默认：福福的小老弟" 
                       class="w-full bg-dcBgDark border border-transparent focus:border-dcBlurple rounded-xl p-3 text-white outline-none mb-5 transition text-sm">
                
                <label class="text-[10px] font-bold text-dcTextMuted uppercase tracking-wider block mb-2">个人头像设置</label>
                <div class="flex flex-col items-center gap-3 py-1">
                    <div class="relative group">
                        <img id="preview-avatar" src="" class="w-20 h-20 rounded-full border-4 border-dcBlurple object-cover shadow-md">
                        <label for="avatar-upload-input" class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center text-white text-xs cursor-pointer opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition duration-200">
                            <i class="fa-solid fa-camera text-base"></i>
                        </label>
                    </div>
                    <input id="avatar-upload-input" type="file" accept="image/*" class="hidden">
                    <button id="random-avatar-btn" class="text-xs text-dcBlurple hover:underline font-semibold bg-dcBlurple/10 px-3 py-1 rounded-full">
                        <i class="fa-solid fa-dice mr-1"></i> 扔骰子换随机头像
                    </button>
                </div>
            </div>

            <button id="join-btn" class="w-full bg-dcBlurple hover:bg-[#4752c4] active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition duration-200 text-sm shadow-lg shadow-dcBlurple/20">
                进入通讯大厅
            </button>
        </div>
    </div>

    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/60 z-30 transition-opacity duration-300"></div>

    <div class="flex flex-1 w-full h-dvh relative overflow-hidden flex-col justify-between">
        
        <div class="flex flex-1 w-full relative overflow-hidden min-h-0">
            
            <div id="left-drawer" class="fixed inset-y-0 left-0 z-40 flex transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300 ease-in-out h-full shadow-2xl md:shadow-none">
                <div class="w-16 bg-dcNav flex flex-col items-center py-3 gap-2 flex-shrink-0">
                    <div class="w-11 h-11 bg-dcBlurple rounded-[12px] flex items-center justify-center text-white cursor-pointer">
                        <i class="fa-brands fa-discord text-xl"></i>
                    </div>
                    <div class="w-8 h-[2px] bg-dcInput rounded my-0.5"></div>
                    <div class="w-11 h-11 bg-dcPanel text-dcGreen rounded-full flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                </div>

                <div class="w-56 bg-dcPanel flex flex-col justify-between flex-shrink-0 border-r border-black/10">
                    <div class="flex flex-col">
                        <div class="h-12 border-b border-dcBgDark/60 flex items-center justify-between px-4 font-bold text-white text-sm shadow-sm">
                            <span class="truncate">福福的专属基地</span>
                            <i class="fa-solid fa-ellipsis text-dcTextMuted text-xs"></i>
                        </div>
                        <div class="p-2">
                            <div class="flex items-center text-dcTextMuted text-[10px] font-bold uppercase tracking-wider px-1 py-1 mb-1">
                                <i class="fa-solid fa-chevron-down mr-1.5 text-[8px]"></i> 语音大厅频道
                            </div>
                            <div class="flex items-center justify-between bg-[#404249] text-white px-2.5 py-2 rounded-lg cursor-pointer">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <span class="text-dcTextMuted font-light text-lg">#</span>
                                    <span class="font-bold text-xs truncate">通讯大厅</span>
                                </div>
                                <i class="fa-solid fa-volume-high text-[10px] text-dcGreen animate-pulse"></i>
                            </div>
                        </div>
                    </div>
                    <div class="h-12 bg-[#232428] flex items-center justify-between px-3">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <img id="drawer-local-avatar" src="" class="w-7 h-7 rounded-full object-cover">
                            <span id="drawer-local-name" class="text-white text-xs font-bold truncate">未登录</span>
                        </div>
                        <button id="drawer-mic-btn" class="w-7 h-7 bg-dcInput/50 hover:bg-dcInput text-white rounded-md flex items-center justify-center transition active:scale-90">
                            <i id="drawer-mic-icon" class="fa-solid fa-microphone text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="right-drawer" class="fixed inset-y-0 right-0 z-40 w-60 bg-dcPanel p-3.5 transform translate-x-full md:translate-x-0 md:relative md:flex flex-col h-full transition-transform duration-300 ease-in-out border-l border-dcBgDark/40 shadow-2xl md:shadow-none">
                <h3 class="text-dcTextMuted text-[10px] font-bold uppercase tracking-wider mb-3 px-1">在线成员 — <span id="member-count">0</span></h3>
                <div id="member-list" class="space-y-1 overflow-y-auto flex-1 discord-scrollbar"></div>
            </div>

            <div class="flex-1 bg-dcChat flex flex-col justify-between h-full w-full min-w-0 relative z-10">
                <div class="h-12 border-b border-dcBgDark/40 flex items-center justify-between px-3.5 shadow-sm bg-dcChat flex-shrink-0">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <button id="menu-toggle-btn" class="text-[#b5bac1] hover:text-white p-1">
                            <i class="fa-solid fa-bars text-lg"></i>
                        </button>
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="text-[#80848e] font-light text-xl">#</span>
                            <span class="text-white font-bold text-sm truncate">通讯大厅</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-[#b5bac1]">
                        <i class="fa-solid fa-magnifying-glass text-sm cursor-pointer hover:text-white"></i>
                        <button id="members-toggle-btn" class="p-1 hover:text-white">
                            <i class="fa-solid fa-user-group text-sm"></i>
                        </button>
                    </div>
                </div>

                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 discord-scrollbar">
                    <div class="text-center py-4 border-b border-gray-800/10">
                        <p class="text-[9px] text-dcTextMuted tracking-widest font-mono">⚡ P2P WEBRTC AUDIO ACTIVE ⚡</p>
                    </div>
                </div>

                <div class="px-3 pb-3 pt-0 flex-shrink-0 relative bg-dcChat">
                    <div id="emoji-picker" class="hidden absolute bottom-14 left-3 right-3 bg-dcPanel border border-gray-800 rounded-2xl p-3 shadow-2xl z-20 animate-fade-in">
                        <p class="text-[10px] font-bold text-dcTextMuted mb-2 px-1">微信系统表情</p>
                        <div id="emoji-grid" class="grid grid-cols-7 gap-3 text-2xl max-h-40 overflow-y-auto discord-scrollbar"></div>
                    </div>

                    <div class="bg-dcInput rounded-2xl flex items-center px-3 py-2 gap-2.5 shadow-md">
                        <label class="cursor-pointer text-[#b5bac1] hover:text-white p-1 flex-shrink-0 active:scale-95 transition">
                            <i class="fa-solid fa-circle-plus text-xl"></i>
                            <input id="image-input" type="file" accept="image/*" class="hidden">
                        </label>
                        
                        <input id="message-input" type="text" placeholder="发送消息到 #通讯大厅" 
                               class="bg-transparent flex-1 outline-none text-white placeholder-[#80848e] text-xs py-1.5 min-w-0">
                        
                        <button id="emoji-btn" class="text-[#b5bac1] hover:text-white p-1 flex-shrink-0 active:scale-95 transition">
                            <i class="fa-regular fa-face-smile text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="h-14 bg-dcNav border-t border-black/20 flex items-center justify-around px-2 pb-safe flex-shrink-0 z-20">
            <div id="nav-home-btn" class="flex flex-col items-center justify-center w-12 h-full text-white cursor-pointer relative">
                <i class="fa-brands fa-discord text-xl"></i>
                <span class="text-[9px] font-bold scale-90 mt-0.5">服务器</span>
            </div>
            <div class="flex flex-col items-center justify-center w-12 h-full text-dcTextMuted opacity-30 cursor-pointer">
                <i class="fa-solid fa-message text-lg"></i>
                <span class="text-[9px] scale-90 mt-0.5">信息</span>
            </div>
            <div class="flex flex-col items-center justify-center w-12 h-full text-dcTextMuted opacity-30 cursor-pointer">
                <i class="fa-solid fa-bell text-lg"></i>
                <span class="text-[9px] scale-90 mt-0.5">通知</span>
            </div>
            <div id="nav-profile-btn" class="flex flex-col items-center justify-center w-12 h-full cursor-pointer relative active:scale-95 transition">
                <div class="relative w-6 h-6">
                    <img id="nav-local-avatar" src="" class="w-full h-full rounded-full object-cover">
                    <div id="nav-status-indicator" class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-dcGreen rounded-full border-2 border-dcNav transition-colors duration-200"></div>
                </div>
                <span id="nav-profile-tag" class="text-[9px] text-dcTextMuted scale-90 mt-0.5 font-medium">讲话中</span>
            </div>
        </div>

    </div>

    <div id="remote-audios" class="hidden"></div>

    <script>
        const ROOM_ID = "fufu_secret_global_lobby_2026"; 
        const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt"; 
        
        let myId = "user_" + Math.random().toString(36).substr(2, 9);
        let myName = "福福的小老弟";
        let myAvatar = "";
        let myRegion = "中国大陆";
        let isMuted = false;
        
        let mqttClient = null;
        let peer = null;
        let localStream = null;
        let activePeers = {}; 

        const wechatEmojis = ["😀","😁","😂","🤣","😅","😊","😍","😘","😜","😎","😭","😡","😱","😓","😴","😷","🤔","🤫","👻","🤡","💩","👍","👎","👏","🤝","🔥","🎉","❤️"];
        const sampleAvatars = [
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=60"
        ];
        
        // 随机掷骰子获取头像的方法
        function rollRandomAvatar() {
            myAvatar = sampleAvatars[Math.floor(Math.random() * sampleAvatars.length)];
            document.getElementById("preview-avatar").src = myAvatar;
        }

        document.addEventListener("DOMContentLoaded", () => {
            rollRandomAvatar(); // 初始随机生成
            initEmojiPicker();
            detectRegion();
            initAppDrawerInteractions(); 
            
            // 扔骰子事件
            document.getElementById("random-avatar-btn").addEventListener("click", rollRandomAvatar);

            // 监听自定义头像上传
            document.getElementById("avatar-upload-input").addEventListener("change", handleCustomAvatarUpload);

            document.getElementById("join-btn").addEventListener("click", () => {
                const inputVal = document.getElementById("username-input").value.trim();
                if(inputVal) myName = inputVal;
                
                // 全局多端同步更新名片
                document.getElementById("drawer-local-name").innerText = myName;
                document.getElementById("drawer-local-avatar").src = myAvatar;
                document.getElementById("nav-local-avatar").src = myAvatar;
                document.getElementById("login-overlay").remove();
                
                startMediaAndConnect();
            });

            document.getElementById("message-input").addEventListener("keydown", (e) => {
                if(e.key === "Enter") sendTextMessage();
            });

            // 控制自身麦克风开关
            document.getElementById("drawer-mic-btn").addEventListener("click", toggleLocalMic);
            document.getElementById("nav-profile-btn").addEventListener("click", toggleLocalMic);
            
            document.getElementById("image-input").addEventListener("change", compressAndSendImage);
            document.getElementById("emoji-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                document.getElementById("emoji-picker").classList.toggle("hidden");
            });
        });

        // --- 🖼️ 自定义头像压缩中继拦截处理 ---
        function handleCustomAvatarUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    // 强制裁剪成 120x120 像素小头像，优化 MQTT 心跳体积
                    const SIZE = 120; 
                    canvas.width = SIZE;
                    canvas.height = SIZE;

                    const ctx = canvas.getContext('2d');
                    // 居中自适应裁剪算法
                    let srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;
                    if (img.width > img.height) {
                        srcW = img.height;
                        srcX = (img.width - img.height) / 2;
                    } else {
                        srcH = img.width;
                        srcY = (img.height - img.width) / 2;
                    }
                    ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, SIZE, SIZE);
                    
                    // 转换为高压缩比 Base64 字符串
                    myAvatar = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById("preview-avatar").src = myAvatar;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- 📱 Discord App 滑动抽屉交互流 ---
        function initAppDrawerInteractions() {
            const leftDrawer = document.getElementById("left-drawer");
            const rightDrawer = document.getElementById("right-drawer");
            const backdrop = document.getElementById("sidebar-backdrop");

            const menuBtn = document.getElementById("menu-toggle-btn");
            const membersBtn = document.getElementById("members-toggle-btn");
            const navHomeBtn = document.getElementById("nav-home-btn");

            function hideAllDrawers() {
                leftDrawer.classList.add("-translate-x-full");
                rightDrawer.classList.add("translate-x-full");
                backdrop.classList.add("hidden");
            }

            const openLeft = (e) => {
                e.stopPropagation();
                rightDrawer.classList.add("translate-x-full");
                leftDrawer.classList.toggle("-translate-x-full");
                backdrop.classList.toggle("hidden", leftDrawer.classList.contains("-translate-x-full"));
            };
            menuBtn.addEventListener("click", openLeft);
            navHomeBtn.addEventListener("click", openLeft);

            membersBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                leftDrawer.classList.add("-translate-x-full");
                rightDrawer.classList.toggle("translate-x-full");
                backdrop.classList.toggle("hidden", rightDrawer.classList.contains("translate-x-full"));
            });

            backdrop.addEventListener("click", hideAllDrawers);
            document.getElementById("chat-messages").addEventListener("click", () => {
                hideAllDrawers();
                document.getElementById("emoji-picker").classList.add("hidden");
            });
        }

        function detectRegion() {
            fetch('https://api.db-ip.com/v2/free/self')
                .then(res => res.json())
                .then(data => {
                    if (data.city || data.province || data.countryName) {
                        myRegion = data.city || data.province || data.countryName;
                    }
                })
                .catch(() => { myRegion = "中国大陆"; });
        }

        function initEmojiPicker() {
            const grid = document.getElementById("emoji-grid");
            wechatEmojis.forEach(emoji => {
                const span = document.createElement("span");
                span.innerText = emoji;
                span.className = "cursor-pointer p-2 hover:bg-dcInput text-center transition select-none active:bg-gray-800 rounded-xl";
                span.onclick = (e) => {
                    e.stopPropagation();
                    document.getElementById("message-input").value += emoji;
                    document.getElementById("emoji-picker").classList.add("hidden");
                };
                grid.appendChild(span);
            });
        }

        // --- 🎙️ P2P 连麦传输矩阵 ---
        async function startMediaAndConnect() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                console.warn("麦克风启动受限，已无缝切换为旁听者模式。", err);
                updateMuteUI(true);
                isMuted = true;
            }

            peer = new Peer(myId);
            peer.on('open', () => { connectMQTT(); });
            peer.on('call', (call) => {
                call.answer(localStream);
                handleIncomingCall(call);
            });
        }

        function connectMQTT() {
            mqttClient = mqtt.connect(MQTT_BROKER);
            mqttClient.on("connect", () => {
                mqttClient.subscribe(`lobby/${ROOM_ID}/chat`);
                mqttClient.subscribe(`lobby/${ROOM_ID}/presence`);
                startHeartbeat();
            });

            mqttClient.on("message", (topic, message) => {
                const payload = JSON.parse(message.toString());
                if (topic.endsWith('/chat')) {
                    displayMessage(payload);
                } else if (topic.endsWith('/presence')) {
                    handlePresence(payload);
                }
            });
        }

        function startHeartbeat() {
            const sendPing = () => {
                const packet = { id: myId, name: myName, avatar: myAvatar, region: myRegion, isMuted: isMuted, timestamp: Date.now() };
                mqttClient.publish(`lobby/${ROOM_ID}/presence`, JSON.stringify(packet));
            };
            sendPing();
            setInterval(sendPing, 3500); 
            setInterval(flushDeadPeers, 9000); 
        }

        function handlePresence(peerInfo) {
            if (peerInfo.id === myId) return;
            if (!activePeers[peerInfo.id]) {
                if (localStream && myId > peerInfo.id) {
                    let call = peer.call(peerInfo.id, localStream);
                    handleIncomingCall(call);
                }
            }
            activePeers[peerInfo.id] = peerInfo;
            renderMemberList();
        }

        function flushDeadPeers() {
            const now = Date.now();
            let changed = false;
            for (let id in activePeers) {
                if (now - activePeers[id].timestamp > 11000) { 
                    const oldAudio = document.getElementById(`audio-${id}`);
                    if (oldAudio) oldAudio.remove();
                    delete activePeers[id];
                    changed = true;
                }
            }
            if (changed) renderMemberList();
        }

        function renderMemberList() {
            const listContainer = document.getElementById("member-list");
            listContainer.innerHTML = "";
            listContainer.appendChild(createMemberRow(myId, myName, myAvatar, myRegion, isMuted, true));
            
            let count = 1;
            for (let id in activePeers) {
                let p = activePeers[id];
                listContainer.appendChild(createMemberRow(p.id, p.name, p.avatar, p.region, p.isMuted, false));
                count++;
            }
            document.getElementById("member-count").innerText = count;
        }

        function createMemberRow(id, name, avatar, region, isPeerMuted, isSelf) {
            const row = document.createElement("div");
            row.className = "flex items-center justify-between p-2 hover:bg-[#35373c] rounded-xl text-xs mb-0.5 transition";
            row.innerHTML = `
                <div class="flex items-center gap-2.5 overflow-hidden flex-1">
                    <div class="relative flex-shrink-0">
                        <img src="${avatar}" class="w-7 h-7 rounded-full object-cover">
                        <div class="absolute bottom-0 right-0 w-2.5 h-2.5 ${isPeerMuted ? 'bg-dcRed':'bg-dcGreen'} rounded-full border-2 border-dcPanel"></div>
                    </div>
                    <div class="flex flex-col overflow-hidden flex-1">
                        <div class="flex items-center gap-1 min-w-0">
                            <span class="text-white font-bold truncate">${name}</span>
                            ${isPeerMuted ? '<i class="fa-solid fa-microphone-slash text-[10px] text-dcRed flex-shrink-0 ml-1"></i>' : ''}
                        </div>
                        <span class="text-dcTextMuted text-[9px] truncate">${region}</span>
                    </div>
                </div>
                ${isSelf ? '<span class="text-[9px] text-dcTextMuted bg-dcBgDark px-1.5 py-0.5 rounded-md flex-shrink-0">自己</span>' : ''}
            `;
            return row;
        }

        function handleIncomingCall(call) {
            call.on('stream', (remoteStream) => {
                let existingAudio = document.getElementById(`audio-${call.peer}`);
                if (!existingAudio) {
                    const audioEl = document.createElement('audio');
                    audioEl.id = `audio-${call.peer}`;
                    audioEl.srcObject = remoteStream;
                    audioEl.autoplay = true;
                    document.getElementById('remote-audios').appendChild(audioEl);
                }
            });
        }

        function toggleLocalMic() {
            if (!localStream) return;
            let audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                updateMuteUI(isMuted);
                
                const packet = { id: myId, name: myName, avatar: myAvatar, region: myRegion, isMuted: isMuted, timestamp: Date.now() };
                mqttClient.publish(`lobby/${ROOM_ID}/presence`, JSON.stringify(packet));
                renderMemberList(); 
            }
        }

        function updateMuteUI(muted) {
            const dMicIcon = document.getElementById("drawer-mic-icon");
            const navIndicator = document.getElementById("nav-status-indicator");
            const navTag = document.getElementById("nav-profile-tag");
            
            if (muted) {
                dMicIcon.className = "fa-solid fa-microphone-slash text-dcRed";
                navIndicator.className = "absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-dcRed rounded-full border-2 border-dcNav";
                navTag.innerText = "已静音";
                navTag.className = "text-[9px] text-dcRed scale-90 mt-0.5 font-bold";
            } else {
                dMicIcon.className = "fa-solid fa-microphone text-xs text-white";
                navIndicator.className = "absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-dcGreen rounded-full border-2 border-dcNav";
                navTag.innerText = "讲话中";
                navTag.className = "text-[9px] text-dcTextMuted scale-90 mt-0.5 font-medium";
            }
        }

        // --- 💬 富文本流聊天模块 ---
        function sendTextMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;

            const msgPacket = { id: myId, name: myName, avatar: myAvatar, region: myRegion, type: "text", content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
            mqttClient.publish(`lobby/${ROOM_ID}/chat`, JSON.stringify(msgPacket));
            input.value = "";
        }

        function compressAndSendImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 450; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6); 

                    const msgPacket = { id: myId, name: myName, avatar: myAvatar, region: myRegion, type: "image", content: compressedBase64, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                    mqttClient.publish(`lobby/${ROOM_ID}/chat`, JSON.stringify(msgPacket));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function displayMessage(msg) {
            const chatZone = document.getElementById("chat-messages");
            const msgRow = document.createElement("div");
            msgRow.className = "flex items-start gap-3 hover:bg-dcBgDark/20 p-1 px-1.5 rounded-lg transition";

            let contentHtml = "";
            if (msg.type === "text") {
                contentHtml = `<p class="text-[#dbdee1] text-[13px] sm:text-sm break-all mt-0.5 leading-relaxed">${escapeHtml(msg.content)}</p>`;
            } else if (msg.type === "image") {
                contentHtml = `<img src="${msg.content}" class="max-w-[180px] sm:max-w-xs max-h-40 rounded-xl border border-dcBgDark mt-1 object-contain shadow-sm" onclick="window.open(this.src)">`;
            }

            msgRow.innerHTML = `
                <img src="${msg.avatar}" class="w-8 h-8 rounded-full object-cover flex-shrink-0 mt-0.5 shadow-sm">
                <div class="flex flex-col min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-white font-bold text-[13px] truncate max-w-[120px]">${msg.name}</span>
                        <span class="text-[8px] text-dcTextMuted bg-dcBgDark px-1.5 py-0.5 rounded font-mono">${msg.region}</span>
                        <span class="text-[9px] text-dcTextMuted font-light">${msg.time}</span>
                    </div>
                    ${contentHtml}
                </div>
            `;
            chatZone.appendChild(msgRow);
            chatZone.scrollTop = chatZone.scrollHeight; 
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
