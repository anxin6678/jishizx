<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片展示</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff;
    }

    img {
      display: block;
      max-width: 100%;
      max-height: 100vh;
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>
  <img src="image.jpg" alt="手写的二维码文字">
</body>
</html>
