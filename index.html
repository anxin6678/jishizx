<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信大厅 · 国内全自愈终极版</title>
    <script src="https://cdn.jsdelivr.net/npm/mqtt@5.5.1/dist/mqtt.min.js"></script>
    <style>
        /* 微信官方经典视觉配色 */
        :root { 
            --wechat-green: #07c160; 
            --wechat-bg: #f3f3f3; 
            --wechat-panel-bg: #f7f7f7;
            --wechat-bubble-me: #95ec69; 
            --wechat-bubble-peer: #ffffff; 
            --text-main: #333333;
            --text-grey: #999999;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e9e9e9; color: var(--text-main); margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* 微信全屏主容器 */
        .wechat-container { width: 100vw; height: 100vh; max-width: 1100px; max-height: 850px; background: var(--wechat-bg); display: flex; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 4px; overflow: hidden; }

        /* 左侧分栏：控制中心与在线列表 */
        .left-panel { width: 320px; background: var(--wechat-panel-bg); border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; }
        .left-header { padding: 25px 20px; border-bottom: 1px solid #e5e5e5; background: #f2f2f2; }
        .left-header h2 { margin: 0; font-size: 1.2em; color: #111; }
        .left-header p { margin: 5px 0 0 0; font-size: 0.85em; color: var(--text-grey); word-break: break-all; }

        .voice-card { padding: 15px 20px; background: #ffffff; border-bottom: 1px solid #e5e5e5; }
        .status-box { padding: 10px; border-radius: 4px; background: #f8f9fa; text-align: center; font-weight: bold; font-size: 0.9em; margin-bottom: 12px; border: 1px solid #e5e5e5; }
        .status-box.active { background: #eef9f2; color: var(--wechat-green); border-color: #c2eed5; }
        
        button.we-btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: 500; font-size: 0.95em; cursor: pointer; transition: 0.1s; text-align: center; }
        button.we-btn.primary { background: var(--wechat-green); color: white; }
        button.we-btn.primary:hover { background: #06ad56; }
        button.we-btn.warn { background: #f5f5f5; color: #fa5151; border: 1px solid #e5e5e5; }
        button.we-btn.warn:hover { background: #e5e5e5; }

        .error-log-box { display: none; margin-top: 10px; padding: 8px 10px; background: #fff5f5; border: 1px solid #ffcccc; border-radius: 4px; color: #fa5151; font-size: 0.82em; line-height: 1.4; word-break: break-all; }

        .member-section { flex: 1; padding: 15px 20px; display: flex; flex-direction: column; min-height: 0; position: relative; }
        .member-title { font-size: 0.85em; color: var(--text-grey); margin-bottom: 10px; }
        .users-grid { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .user-pill { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
        .user-avatar { width: 36px; height: 36px; border-radius: 4px; background: #5b92e5; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; text-transform: uppercase; }
        .user-pill.me .user-avatar { background: var(--wechat-green); }
        .user-name { font-size: 0.95em; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 【iPad/手机端音轨长鸣核心】：绝不能用 display:none 隐藏，必须原位小像素可见渲染，强行破解苹果防省电挂起机制 */
        .safe-audio-host { width: 2px; height: 2px; opacity: 0.01; overflow: hidden; background: transparent; border: none; margin-top: auto; }

        /* 右侧独立打字聊天视窗区 */
        .right-panel { flex: 1; display: flex; flex-direction: column; background: var(--wechat-bg); }
        .right-header { height: 62px; background: var(--wechat-panel-bg); border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; padding: 0 25px; font-weight: bold; font-size: 1.1em; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px 25px; min-height: 0; }
        
        .msg-wrapper { display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start; width: 100%; }
        .msg-content-box { display: flex; flex-direction: column; max-width: 70%; }
        .msg-author { font-size: 0.75em; color: var(--text-grey); margin-bottom: 4px; padding-left: 4px; }
        
        .msg-bubble { padding: 10px 12px; border-radius: 4px; font-size: 0.95em; line-height: 1.5; word-break: break-all; white-space: pre-wrap; position: relative; }
        .msg-wrapper.peer { justify-content: flex-start; }
        .msg-wrapper.peer .msg-bubble { background: var(--wechat-bubble-peer); border: 1px solid #e5e5e5; color: #000; }
        
        .msg-wrapper.me { justify-content: flex-end; }
        .msg-wrapper.me .msg-bubble { background: var(--wechat-bubble-me); border: 1px solid #87d259; color: #000; }

        .msg-system { text-align: center; margin: 15px 0; }
        .msg-system span { background: rgba(0,0,0,0.05); color: #888; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; }
        .chat-img { max-width: 250px; max-height: 250px; border-radius: 4px; cursor: pointer; margin-top: 2px; border: 1px solid #e5e5e5; }

        .input-toolbar { background: var(--wechat-panel-bg); border-top: 1px solid #e5e5e5; display: flex; flex-direction: column; padding: 10px 25px 15px 25px; position: relative; }
        .tool-bar-icons { display: flex; gap: 15px; margin-bottom: 5px; }
        .icon-btn { font-size: 1.4em; cursor: pointer; user-select: none; opacity: 0.65; }
        .icon-btn:hover { opacity: 1; }

        textarea { width: 100%; height: 75px; background: transparent; border: none; outline: none; resize: none; font-family: inherit; font-size: 1em; padding: 5px 0; line-height: 1.5; }
        .send-btn-wrap { display: flex; justify-content: flex-end; margin-top: 5px; }
        button.we-send-btn { background: #f5f5f5; color: var(--wechat-green); border: 1px solid #e5e5e5; padding: 6px 18px; border-radius: 4px; font-size: 0.9em; font-weight: 500; cursor: pointer; }
        button.we-send-btn:hover { background: #e5e5e5; }

        .emoji-picker { position: absolute; bottom: 150px; left: 25px; background: white; border: 1px solid #e5e5e5; padding: 10px; border-radius: 4px; display: none; grid-template-columns: repeat(7, 1fr); gap: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); z-index: 100; }
        .emoji-picker span { cursor: pointer; font-size: 1.4em; text-align: center; }

        @media (max-width: 768px) {
            .wechat-container { flex-direction: column; height: 100vh; border-radius: 0; }
            .left-panel { width: 100%; height: auto; flex: none; }
            .left-header { padding: 15px; }
            .voice-card { padding: 10px 15px; }
            .member-section { display: none; } 
            textarea { height: 55px; }
        }
    </style>
</head>
<body>

    <div class="wechat-container">
        
        <div class="left-panel">
            <div class="left-header">
                <h2>微信大厅 · 极速重连版</h2>
                <p>我的昵称: <span id="my-id" style="font-weight: bold; color: var(--wechat-green);">设置中...</span></p>
            </div>
            
            <div class="voice-card">
                <div id="voice-status-box" class="status-box">当前状态：未加入语音</div>
                <button id="btn-join" class="we-btn primary" onclick="joinGlobalVoice()">🚀 开启麦克风说话</button>
                <button id="btn-mute" class="we-btn warn" style="display: none;" onclick="toggleMute()">🎙️ 静音麦克风</button>
                <div id="error-log-box" class="error-log-box"></div>
            </div>
            
            <div class="member-section">
                <div class="member-title" id="member-count-title">在线群成员 (1)</div>
                <div id="users-grid" class="users-grid"></div>
                
                <div id="audio-container" class="safe-audio-host"></div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="right-header" id="room-title">公共大厅大群聊 (1)</div>
            <div id="chat-box"></div>
            
            <div class="input-toolbar">
                <div class="tool-bar-icons">
                    <span class="icon-btn" onclick="toggleEmojiPicker()">😀</span>
                    <div id="emoji-picker" class="emoji-picker"></div>
                    <span class="icon-btn" onclick="document.getElementById('file-input').click()">🖼️</span>
                    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="sendImage(this)">
                </div>
                <textarea id="msg-input" placeholder="不用开麦，在此输入文字直接畅聊..." onkeypress="handleKeyPress(event)"></textarea>
                <div class="send-btn-wrap">
                    <button class="we-send-btn" onclick="sendTextMsg()">发送</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // === 国内特调：六重大厂顶级高速 STUN 穿透服务器资源池，全方位打通移动/电信/联通跨网互联 ===
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.aliyun.com:3478' },
                { urls: 'stun:stun.miwifi.com:3478' },
                { urls: 'stun:stun.winphone.com:3478' },
                { urls: 'stun:stun.360.cn:3478' },
                { urls: 'stun:stun.hit.edu.cn:3478' },
                { urls: 'stun:stun.nextcloud.com:3478' }
            ]
        };

        // 引入房间隔离专属命名空间
        let userRoomInput = prompt("请输入您想加入的【房间编号】（默认为666）：", "666");
        const roomNumber = (userRoomInput && userRoomInput.trim() !== "") ? userRoomInput.trim() : "666";
        const BASE_TOPIC = 'wechat-lobby-china-isolated-room-' + roomNumber;

        // 自定义改名与“福福的手下”以此类推兜底机制
        let savedName = localStorage.getItem('wechat_room_username') || '';
        let customName = prompt(`您当前处于房间 [ ${roomNumber} ]\n\n请输入您的个性昵称（若留空，将自动分配为 福福的手下1、2、3...）：`, savedName);
        
        let myId = '';
        if (customName && customName.trim() !== "") {
            myId = customName.trim();
            localStorage.setItem('wechat_room_username', myId); 
        } else {
            // “福福的手下1,2,3...以此类推”自动化派生号，防止重名导致通道死锁
            myId = '福福的手下' + Math.floor(Math.random() * 20 + 1);
        }
        
        let localStream = null;
        let isMuted = false;
        
        const onlineUsers = {}; 
        const rtcPeers = {};    

        const chatBox = document.getElementById('chat-box');
        const usersGrid = document.getElementById('users-grid');
        const audioContainer = document.getElementById('audio-container');
        const msgInput = document.getElementById('msg-input');
        const voiceStatusBox = document.getElementById('voice-status-box');
        const errorLogBox = document.getElementById('error-log-box');

        // 表情初始化
        const emojis = ['😀','😂','🥰','😎','😭','😡','🥳','🤔','👍','👎','❤️','🔥','🎉','👀','🐶','🐱','✨','💯'];
        const emojiPicker = document.getElementById('emoji-picker');
        emojis.forEach(e => {
            const span = document.createElement('span'); span.innerText = e;
            span.onclick = () => { msgInput.value += e; emojiPicker.style.display = 'none'; msgInput.focus(); };
            emojiPicker.appendChild(span);
        });
        function toggleEmojiPicker() { emojiPicker.style.display = (emojiPicker.style.display === 'grid') ? 'none' : 'grid'; }
        document.addEventListener('click', (e) => { if (!e.target.closest('.tool-bar-icons') && emojiPicker) emojiPicker.style.display = 'none'; });

        // 连接国内优化的专线信道
        const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

        mqttClient.on('connect', () => {
            document.getElementById('my-id').innerText = myId;
            logSystem(`成功连入隔离房间 [${roomNumber}]！文字交互已实时互通。`);
            
            mqttClient.subscribe(`${BASE_TOPIC}/chat`);
            mqttClient.subscribe(`${BASE_TOPIC}/presence`);
            mqttClient.subscribe(`${BASE_TOPIC}/user/${myId}`);

            publishPresence({ type: 'join', id: myId, wantsVoice: false });
            renderUsersUI();
        });

        mqttClient.on('message', async (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                
                if (topic === `${BASE_TOPIC}/chat`) {
                    if (data.from === myId) return;
                    if (data.msgType === 'text') logMessage(data.content, 'peer', data.from);
                    if (data.msgType === 'image') logImage(data.from, data.content, 'peer');
                }
                else if (topic === `${BASE_TOPIC}/presence`) {
                    if (data.id === myId) return;
                    
                    if (data.type === 'join') {
                        onlineUsers[data.id] = { wantsVoice: data.wantsVoice };
                        sendDirectMsg(data.id, { type: 'reply-presence', from: myId, wantsVoice: !!localStream });
                        logSystem(`群友 [${data.id}] 进入了聊天室`);
                        renderUsersUI();
                    } 
                    else if (data.type === 'voice-state-change') {
                        if (!onlineUsers[data.id]) onlineUsers[data.id] = {};
                        onlineUsers[data.id].wantsVoice = data.wantsVoice;
                        renderUsersUI();
                        if (data.wantsVoice && localStream && myId > data.id) {
                            initiateVoiceCall(data.id);
                        }
                    }
                    else if (data.type === 'leave') {
                        cleanupUser(data.id);
                    }
                }
                else if (topic === `${BASE_TOPIC}/user/${myId}`) {
                    const fromPeer = data.from;
                    
                    if (data.type === 'reply-presence') {
                        onlineUsers[fromPeer] = { wantsVoice: data.wantsVoice };
                        renderUsersUI();
                        if (data.wantsVoice && localStream && myId > fromPeer) {
                            initiateVoiceCall(fromPeer);
                        }
                    }
                    else if (data.type === 'offer') {
                        handleOfferSignal(fromPeer, data.offer);
                    }
                    else if (data.type === 'answer') {
                        if (rtcPeers[fromPeer]) await rtcPeers[fromPeer].setRemoteDescription(new RTCSessionDescription(data.answer));
                    }
                    else if (data.type === 'candidate') {
                        if (rtcPeers[fromPeer]) await rtcPeers[fromPeer].addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            } catch(e) {}
        });

        setInterval(() => {
            if (mqttClient && mqttClient.connected) {
                publishPresence({ type: 'join', id: myId, wantsVoice: !!localStream });
            }
        }, 5000);

        // === 3. 原生 WebRTC 核心架构 ===
        function createRtcConnection(targetId) {
            if (rtcPeers[targetId]) return rtcPeers[targetId];

            const pc = new RTCPeerConnection(rtcConfig);
            rtcPeers[targetId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (e) => {
                if (e.candidate) sendDirectMsg(targetId, { type: 'candidate', from: myId, candidate: e.candidate });
            };

            pc.ontrack = (e) => {
                let audioEl = document.getElementById('audio-' + targetId);
                if (!audioEl) {
                    audioEl = document.createElement('audio');
                    audioEl.id = 'audio-' + targetId;
                    audioEl.setAttribute('autoplay', 'true');
                    audioEl.setAttribute('playsinline', 'true'); 
                    audioContainer.appendChild(audioEl);
                }
                
                audioEl.srcObject = e.streams[0] || new MediaStream([e.track]);
                audioEl.muted = false;
                audioEl.volume = 1.0;

                // 强制触发播放
                audioEl.play().catch(err => console.log("等待全局触碰动作激活放音", err));
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'failed' || pc.connectionState === 'closed') cleanupUser(targetId);
            };

            return pc;
        }

        async function initiateVoiceCall(targetId) {
            const pc = createRtcConnection(targetId);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendDirectMsg(targetId, { type: 'offer', from: myId, offer: offer });
        }

        async function handleOfferSignal(fromPeer, offer) {
            const pc = createRtcConnection(fromPeer);
            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendDirectMsg(fromPeer, { type: 'answer', from: myId, answer: answer });
        }

        // === 4. 开启麦克风大厅模块 ===
        async function joinGlobalVoice() {
            if (localStream) return;
            errorLogBox.style.display = 'none';

            // 解锁 AudioContext
            unlockAudioContext();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                printError("浏览器拦截：非 HTTPS 安全网址下禁止开麦，请确保网址以 https:// 开头并用自带浏览器打开！");
                return;
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                voiceStatusBox.innerText = "🟢 已进入群语音通话";
                voiceStatusBox.className = "status-box active";
                document.getElementById('btn-join').style.display = 'none';
                document.getElementById('btn-mute').style.display = 'inline-block';

                publishPresence({ type: 'voice-state-change', id: myId, wantsVoice: true });

                Object.keys(onlineUsers).forEach(pId => {
                    if (onlineUsers[pId].wantsVoice && myId > pId) initiateVoiceCall(pId);
                });
                logSystem('你的麦克风成功启用，大家现在能听到你说话了！');
            } catch (err) {
                let msg = `激活失败: `;
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    msg += "权限被拒绝，请点击浏览器左侧 🔒 允许使用麦克风。";
                } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                    msg += "麦克风被其他语音程序（如微信电话）占用，请彻底清除后台应用后再试。";
                } else {
                    msg += "未检测到设备，或发生未知硬件死锁。";
                }
                printError(msg);
            }
        }

        function printError(text) {
            errorLogBox.innerText = text;
            errorLogBox.style.display = 'block';
        }

        // === 【全局无感自愈核心】：监听全屏任意点击，强行唤醒苹果/安卓的所有音频播放流 ===
        function unlockAudioContext() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const ctx = new AudioContext();
                    if (ctx.state === 'suspended') ctx.resume();
                }
            } catch(e) {}
        }

        function playAllGroundedAudios() {
            if(!audioContainer) return;
            const audios = audioContainer.getElementsByTagName('audio');
            for (let audio of audios) { 
                if (audio.paused) {
                    audio.muted = false;
                    audio.play().catch(e => console.log("放音自愈修复失败:", e));
                }
            }
        }

        // 捕获全网点击手势实现盲解放音
        document.addEventListener('click', () => { unlockAudioContext(); playAllGroundedAudios(); }, true);
        document.addEventListener('touchstart', () => { unlockAudioContext(); playAllGroundedAudios(); }, true);

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            const btn = document.getElementById('btn-mute');
            if (isMuted) { btn.innerText = "body 已暂停说话"; btn.className = "we-btn primary"; } 
            else { btn.innerText = "🎙️ 静音麦克风"; btn.className = "we-btn warn"; }
        }

        function cleanupUser(pId) {
            if (rtcPeers[pId]) { rtcPeers[pId].close(); delete rtcPeers[pId]; }
            if (onlineUsers[pId]) delete onlineUsers[pId];
            const el = document.getElementById('audio-' + pId); if (el) el.remove();
            renderUsersUI();
            logSystem(`群友 [${pId}] 退出了聊天室`);
        }

        function publishPresence(data) { if(mqttClient && mqttClient.connected) mqttClient.publish(`${ROOM_TOPIC}/presence`, JSON.stringify(data)); }
        function sendDirectMsg(targetId, data) { if(mqttClient && mqttClient.connected) mqttClient.publish(`${ROOM_TOPIC}/user/${targetId}`, JSON.stringify(data)); }

        window.addEventListener('beforeunload', () => {
            publishPresence({ type: 'leave', id: myId });
        });

        // === 6. 微信对话公屏流 ===
        function handleKeyPress(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTextMsg(); } }
        
        function sendTextMsg() {
            const text = msgInput.value.trim(); if (!text) return;
            logMessage(text, 'me', myId);
            if(mqttClient && mqttClient.connected) {
                mqttClient.publish(`${ROOM_TOPIC}/chat`, JSON.stringify({ from: myId, msgType: 'text', content: text }));
            }
            msgInput.value = '';
        }

        function sendImage(input) {
            const file = input.files[0]; if (!file || file.size > 2 * 1024 * 1024) return alert('⚠️ 图片不能超过 2MB！');
            const r = new FileReader();
            r.onload = function(e) {
                const base64 = e.target.result;
                logImage('我', base64, 'me');
                if(mqttClient && mqttClient.connected) {
                    mqttClient.publish(`${ROOM_TOPIC}/chat`, JSON.stringify({ from: myId, msgType: 'image', content: base64 }));
                }
            };
            r.readAsDataURL(file); input.value = '';
        }

        // === 7. 微信气泡渲染器 ===
        function logMessage(m, type, senderId) {
            const wrapper = document.createElement('div'); wrapper.className = `msg-wrapper ${type}`;
            const avatar = document.createElement('div'); avatar.className = 'user-avatar';
            avatar.innerText = type === 'me' ? '我' : senderId.charAt(0).toUpperCase();
            
            const contentBox = document.createElement('div'); contentBox.className = 'msg-content-box';
            if (type === 'peer') {
                const author = document.createElement('div'); author.className = 'msg-author'; author.innerText = senderId;
                contentBox.appendChild(author);
            }
            const bubble = document.createElement('div'); bubble.className = 'msg-bubble'; bubble.innerText = m;
            contentBox.appendChild(bubble);
            if (type === 'me') { wrapper.appendChild(contentBox); wrapper.appendChild(avatar); } 
            else { wrapper.appendChild(avatar); wrapper.appendChild(contentBox); }
            chatBox.appendChild(wrapper); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function logImage(senderName, base64Data, type) {
            const wrapper = document.createElement('div'); wrapper.className = `msg-wrapper ${type}`;
            const avatar = document.createElement('div'); avatar.className = 'user-avatar';
            avatar.innerText = type === 'me' ? '我' : senderName.charAt(0).toUpperCase();
            
            const contentBox = document.createElement('div'); contentBox.className = 'msg-content-box';
            if (type === 'peer') {
                const author = document.createElement('div'); author.className = 'msg-author'; author.innerText = senderName;
                contentBox.appendChild(author);
            }
            const img = document.createElement('img'); img.src = base64Data; img.className = 'chat-img'; img.onclick = () => window.open(base64Data);
            contentBox.appendChild(img);
            if (type === 'me') { wrapper.appendChild(contentBox); wrapper.appendChild(avatar); } 
            else { wrapper.appendChild(avatar); wrapper.appendChild(contentBox); }
            chatBox.appendChild(wrapper);
            setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100);
        }

        function logSystem(m) { 
            const div = document.createElement('div'); div.className = 'msg-system'; div.innerHTML = `<span>${m}</span>`;
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('room-title').innerText = `大群聊 - 房间 ${roomId}`;

        function renderUsersUI() {
            usersGrid.innerHTML = '';
            usersGrid.appendChild(createUserPill(myId, true, !!localStream));
            Object.keys(onlineUsers).forEach(id => {
                usersGrid.appendChild(createUserPill(id, false, onlineUsers[id].wantsVoice));
            });
            const total = Object.keys(onlineUsers).length + 1;
            document.getElementById('member-count-title').innerText = `在线群成员 (${total})`;
        }
        
        function createUserPill(id, isMe, hasVoice) {
            const d = document.createElement('div'); d.className = `user-pill ${isMe ? 'me' : ''}`;
            const a = document.createElement('div'); a.className = 'user-avatar';
            a.innerText = id.charAt(0).toUpperCase(); 
            const n = document.createElement('span'); n.className = 'user-name'; 
            n.innerText = (isMe ? `${id} (我)` : id) + (hasVoice ? ' 🎙️' : '');
            d.appendChild(a); d.appendChild(n); return d;
        }
    </script>
</body>
</html>
