<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天界面演示</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1621;
      --panel: #17212b;
      --panel-light: #202b36;
      --line: #263441;
      --text: #e8edf2;
      --muted: #8b9bab;
      --accent: #3390ec;
      --outgoing: #2b5278;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      max-width: 1440px;
      margin: auto;
      border-inline: 1px solid var(--line);
    }

    aside {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .sidebar-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand { margin: 0; font-size: 20px; }
    .demo-badge {
      color: #ffd166;
      border: 1px solid #705f34;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
    }

    .search, .composer-input {
      width: 100%;
      border: 1px solid var(--line);
      outline: none;
      color: var(--text);
      background: #0e1621;
      border-radius: 10px;
      padding: 11px 13px;
    }

    .search:focus, .composer-input:focus { border-color: var(--accent); }

    .notice {
      margin: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      color: #c9d8e6;
      background: #20364a;
      font-size: 12px;
    }

    .chat-list { overflow-y: auto; }

    .chat {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      text-align: left;
      color: inherit;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.025);
      background: transparent;
      cursor: pointer;
    }

    .chat:hover, .chat.active { background: var(--panel-light); }

    .avatar {
      flex: 0 0 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, #56b5f7, #547be8);
    }

    .chat-copy { min-width: 0; flex: 1; }
    .chat-title { font-weight: 600; }
    .chat-preview {
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 20%, rgba(67, 101, 128, .09), transparent 30%),
        var(--bg);
    }

    .chat-header {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .header-title { font-weight: 650; }
    .header-subtitle { color: var(--muted); font-size: 12px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px clamp(14px, 5vw, 70px);
    }

    .message {
      max-width: min(72%, 620px);
      align-self: flex-start;
      padding: 9px 12px;
      border-radius: 12px 12px 12px 3px;
      overflow-wrap: anywhere;
      background: var(--panel-light);
    }

    .message.outgoing {
      align-self: flex-end;
      border-radius: 12px 12px 3px 12px;
      background: var(--outgoing);
    }

    .message time {
      display: block;
      margin-top: 4px;
      color: #b6c8d8;
      text-align: right;
      font-size: 10px;
    }

    .message img {
      display: block;
      max-width:  min(100%, 360px);
      max-height: 300px;
      border-radius: 8px;
    }

    .message audio { max-width: 100%; }

    .empty {
      margin: auto;
      padding: 10px 16px;
      border-radius: 12px;
      color: #d6e2ec;
      background: rgba(32, 43, 54, .9);
      text-align: center;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }

    .composer-input { flex: 1; min-width: 0; }

    .icon-button, .send-button, .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      border: 0;
      border-radius: 10px;
      background: var(--panel-light);
      cursor: pointer;
    }

    .send-button { color: white; background: var(--accent); font-weight: 650; }
    .icon-button:hover, .file-button:hover { filter: brightness(1.15); }
    .send-button:hover { filter: brightness(1.1); }
    input[type="file"] { display: none; }

    @media (max-width: 700px) {
      .app { grid-template-columns: 76px 1fr; }
      .sidebar-head { padding: 12px 8px; }
      .brand-row { justify-content: center; }
      .brand { display: none; }
      .demo-badge { font-size: 9px; padding: 3px 5px; }
      .search, .notice, .chat-copy { display: none; }
      .chat { justify-content: center; padding: 10px 5px; }
      .avatar { flex-basis: 44px; height: 44px; }
      .chat-header { padding-inline: 12px; }
      .composer { gap: 6px; padding: 9px; }
      .icon-button, .file-button { min-width: 36px; padding: 0 8px; }
      .send-button { min-width: 42px; padding: 0 10px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="sidebar-head">
        <div class="brand-row">
          <h1 class="brand">聊天演示</h1>
          <span class="demo-badge">本地原型</span>
        </div>
        <input id="search" class="search" type="search" placeholder="搜索演示聊天">
      </div>

      <div class="notice">
        这是静态界面演示。消息和附件不会发送到 Telegram。
      </div>

      <nav id="chatList" class="chat-list" aria-label="演示聊天列表"></nav>
    </aside>

    <main>
      <header class="chat-header">
        <div id="headerAvatar" class="avatar">群</div>
        <div>
          <div id="headerTitle" class="header-title">选择一个聊天</div>
          <div id="headerSubtitle" class="header-subtitle">本地演示</div>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="empty">选择左侧聊天，开始本地界面演示</div>
      </section>

      <form id="composer" class="composer">
        <label class="file-button" title="选择图片">
          图片
          <input id="imageInput" type="file" accept="image/*">
        </label>
        <label class="file-button" title="选择音频文件">
          音频
          <input id="audioInput" type="file" accept="audio/*">
        </label>
        <button id="recordButton" class="icon-button" type="button" title="录制语音">🎙</button>
        <input id="messageInput" class="composer-input" type="text" placeholder="输入演示消息…" autocomplete="off">
        <button class="send-button" type="submit">发送</button>
      </form>
    </main>
  </div>

  <script>
    // 示例数据仅保存在当前页面内，不会连接 Telegram 或上传到服务器。
    const chats = [
      { id: "team", title: "项目讨论组", subtitle: "12 位成员", avatar: "项", color: "linear-gradient(135deg,#45c2a8,#168c94)",
        messages: [{ text: "欢迎来到本地界面演示！", outgoing: false }] },
      { id: "friends", title: "朋友们", subtitle: "3 位成员", avatar: "友", color: "linear-gradient(135deg,#f6a65b,#dc6372)",
        messages: [{ text: "这里是示例聊天，不是真实 Telegram 群聊。", outgoing: false }] },
      { id: "notes", title: "我的笔记", subtitle: "私人聊天", avatar: "记", color: "linear-gradient(135deg,#9b7bea,#5a72d8)",
        messages: [{ text: "可以在输入框试发一条本地消息。", outgoing: false }] },
      { id: "design", title: "设计交流", subtitle: "8 位成员", avatar: "设", color: "linear-gradient(135deg,#f071a3,#a04db3)",
        messages: [{ text: "支持选择图片或音频文件进行本地预览。", outgoing: false }] }
    ];

    const chatList = document.querySelector("#chatList");
    const messagesEl = document.querySelector("#messages");
    const searchEl = document.querySelector("#search");
    const messageInput = document.querySelector("#messageInput");
    const imageInput = document.querySelector("#imageInput");
    const audioInput = document.querySelector("#audioInput");
    const recordButton = document.querySelector("#recordButton");

    let selectedChat = null;
    let recorder = null;
    let recordingChunks = [];

    function renderChatList(filter = "") {
      chatList.replaceChildren();
      chats.filter(chat => chat.title.toLowerCase().includes(filter.toLowerCase()))
        .forEach(chat => {
          const button = document.createElement("button");
          button.className = "chat" + (selectedChat?.id === chat.id ? " active" : "");
          button.type = "button";
          button.innerHTML = `
            <span class="avatar" style="background:${chat.color}">${chat.avatar}</span>
            <span class="chat-copy">
              <span class="chat-title">${escapeHTML(chat.title)}</span><br>
              <span class="chat-preview">${escapeHTML(chat.subtitle)}</span>
            </span>`;
          button.addEventListener("click", () => selectChat(chat));
          chatList.append(button);
        });
    }

    function selectChat(chat) {
      selectedChat = chat;
      document.querySelector("#headerTitle").textContent = chat.title;
      document.querySelector("#headerSubtitle").textContent = chat.subtitle + " · 演示数据";
      const avatar = document.querySelector("#headerAvatar");
      avatar.textContent = chat.avatar;
      avatar.style.background = chat.color;
      renderChatList(searchEl.value);
      renderMessages();
      messageInput.focus();
    }

    function renderMessages() {
      messagesEl.replaceChildren();
      selectedChat.messages.forEach(message => {
        const bubble = document.createElement("div");
        bubble.className = "message" + (message.outgoing ? " outgoing" : "");

        if (message.kind === "image") {
          const img = document.createElement("img");
          img.src = message.url;
          img.alt = message.name || "本地图片预览";
          bubble.append(img);
        } else if (message.kind === "audio") {
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = message.url;
          bubble.append(audio);
        } else {
          bubble.append(document.createTextNode(message.text));
        }

        const time = document.createElement("time");
        time.textContent = message.time || new Date().toLocaleTimeString([], {
          hour: "2-digit", minute: "2-digit"
        });
        bubble.append(time);
        messagesEl.append(bubble);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(message) {
      if (!selectedChat) {
        alert("请先选择一个演示聊天。");
        return;
      }
      selectedChat.messages.push({ ...message, outgoing: true });
      renderMessages();
    }

    function escapeHTML(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    searchEl.addEventListener("input", () => renderChatList(searchEl.value));

    document.querySelector("#composer").addEventListener("submit", event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      addMessage({ text });
      messageInput.value = "";
    });

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) return;
      addMessage({ kind: "image", url: URL.createObjectURL(file), name: file.name });
      imageInput.value = "";
    });

    audioInput.addEventListener("change", () => {
      const file = audioInput.files[0];
      if (!file) return;
      addMessage({ kind: "audio", url: URL.createObjectURL(file), name: file.name });
      audioInput.value = "";
    });

    recordButton.addEventListener("click", async () => {
      if (recorder?.state === "recording") {
        recorder.stop();
        recordButton.textContent = "🎙";
        recordButton.title = "录制语音";
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        alert("当前浏览器不支持录音，或页面不是 HTTPS/localhost。");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordingChunks = [];
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = event => {
          if (event.data.size) recordingChunks.push(event.data);
        };
        recorder.onstop = () => {
          const blob = new Blob(recordingChunks, { type: recorder.mimeType || "audio/webm" });
          stream.getTracks().forEach(track => track.stop());
          addMessage({ kind: "audio", url: URL.createObjectURL(blob), name: "本地录音" });
        };
        recorder.start();
        recordButton.textContent = "⏹";
        recordButton.title = "停止录音";
      } catch {
        alert("无法访问麦克风，请检查浏览器权限。录音仅用于本地预览。");
      }
    });

    renderChatList();
  </script>
</body>
</html>
