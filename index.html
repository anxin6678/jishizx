    <script>
        const ROOM_ID = "fufu_secret_global_lobby_2026"; 
        const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt"; 
        
        let myId = "user_" + Math.random().toString(36).substr(2, 9);
        let myName = "福福的小老弟";
        let myAvatar = "";
        let myRegion = "中国大陆";
        let myDevice = "未知设备";
        let isMuted = false;
        
        let mqttClient = null;
        let peer = null;
        let localStream = null;
        let activePeers = {}; 

        const wechatEmojis = ["😀","😁","😂","🤣","😅","😊","😍","😘","😜","😎","😭","😡","😱","😓","😴","😷","🤔","🤫","👻","🤡","💩","👍","👎","👏","🤝","🔥","🎉","❤️"];
        const sampleAvatars = [
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=60"
        ];
        
        function detectDeviceType() {
            const ua = navigator.userAgent;
            if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return "iPad";
            if (/iPhone|iPod/.test(ua)) return "iPhone";
            if (/Android/.test(ua)) return "Android";
            if (/Windows/.test(ua)) return "Windows";
            if (/Macintosh|MacIntel/.test(ua)) return "Mac";
            return "智能设备";
        }

        function rollRandomAvatar() {
            myAvatar = sampleAvatars[Math.floor(Math.random() * sampleAvatars.length)];
            document.getElementById("preview-avatar").src = myAvatar;
        }

        document.addEventListener("DOMContentLoaded", () => {
            myDevice = detectDeviceType(); 
            rollRandomAvatar(); 
            initEmojiPicker();
            detectRegion();
            initAppDrawerInteractions(); 
            initIOSAudioUnlocker(); 
            initDiagnosticCenter(); // 启动诊断总线监听
            
            document.getElementById("random-avatar-btn").addEventListener("click", rollRandomAvatar);
            document.getElementById("avatar-upload-input").addEventListener("change", handleCustomAvatarUpload);

            document.getElementById("join-btn").addEventListener("click", () => {
                const inputVal = document.getElementById("username-input").value.trim();
                if(inputVal) myName = inputVal;
                
                document.getElementById("drawer-local-name").innerText = myName;
                document.getElementById("drawer-local-avatar").src = myAvatar;
                document.getElementById("nav-local-avatar").src = myAvatar;
                document.getElementById("login-overlay").remove();
                
                startMediaAndConnect();
            });

            document.getElementById("message-input").addEventListener("keydown", (e) => {
                if(e.key === "Enter") sendTextMessage();
            });

            document.getElementById("drawer-mic-btn").addEventListener("click", toggleLocalMic);
            document.getElementById("nav-profile-btn").addEventListener("click", toggleLocalMic);
            
            document.getElementById("image-input").addEventListener("change", compressAndSendImage);
            document.getElementById("emoji-btn").addEventListener("click", (e) => {
                e.stopPropagation();
                document.getElementById("emoji-picker").classList.toggle("hidden");
            });
        });

        // --- 🔧 【新增】智能诊断面板交互与动态计算逻辑 ---
        function initDiagnosticCenter() {
            const modal = document.getElementById("diagnostic-modal");
            const openBtn = document.getElementById("open-diagnostic-btn");
            const closeBtn = document.getElementById("close-diagnostic-btn");
            const resetBtn = document.getElementById("reset-audio-btn");

            openBtn.addEventListener("click", () => {
                modal.classList.remove("hidden");
                runLiveDiagnostic(); // 打开时立刻做体检
            });

            closeBtn.addEventListener("click", () => modal.classList.add("hidden"));
            resetBtn.addEventListener("click", () => {
                modal.classList.add("hidden");
                resetAudioNetwork(); // 执行一键全网络热重置
            });
        }

        function runLiveDiagnostic() {
            const pMic = document.getElementById("diag-mic-perm");
            const pTrack = document.getElementById("diag-audio-track");
            const pCtx = document.getElementById("diag-audio-ctx");
            const pP2p = document.getElementById("diag-p2p-status");

            // 1. 检查麦克风硬件/流存在
            if (localStream) {
                pMic.innerText = "已授权 ✅"; pMic.className = "font-bold text-dcGreen";
                // 2. 检查轨道活性
                const track = localStream.getAudioTracks()[0];
                if (track && track.readyState === 'live') {
                    pTrack.innerText = isMuted ? "已关闭 (本地静音) 🛑" : "正常采集传输中 🎙️";
                    pTrack.className = isMuted ? "font-bold text-yellow-500" : "font-bold text-dcGreen";
                } else {
                    pTrack.innerText = "流轨道异常挂死 ❌"; pTrack.className = "font-bold text-dcRed";
                }
            } else {
                pMic.innerText = "未授权/拒绝 ❌"; pMic.className = "font-bold text-dcRed";
                pTrack.innerText = "无音频源 ❌"; pTrack.className = "font-bold text-dcRed";
            }

            // 3. 检查 AudioContext (防止iPad自动锁死)
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                pCtx.innerText = "就绪 ✅"; pCtx.className = "font-bold text-dcGreen";
            } else {
                pCtx.innerText = "内核不支持 ❌"; pCtx.className = "font-bold text-dcRed";
            }

            // 4. 检查 P2P 打洞网络
            if (peer && !peer.destroyed) {
                pP2p.innerText = peer.disconnected ? "中继器断开 ⚠️" : "隧道打洞就绪 🌐";
                pP2p.className = peer.disconnected ? "font-bold text-yellow-500" : "font-bold text-dcGreen";
            } else {
                pP2p.innerText = "未启动/崩溃 ❌"; pP2p.className = "font-bold text-dcRed";
            }
        }

        // --- 🔧 【核心重构】纯前端 P2P 通道一键完全秘密重构引擎 ---
        async function resetAudioNetwork() {
            console.log("🚀 启动音频网络深度全清理重置机制...");
            
            // A. 清理宿主容器内的老音频标签，阻断任何声音挂死残留
            document.getElementById('remote-audios').innerHTML = "";

            // B. 彻底优雅销毁老 PeerJS 实例并解封占用的本地端口
            if (peer) {
                try {
                    peer.destroy();
                } catch(e) { console.log(e); }
                peer = null;
            }

            // C. 重新申请采集麦克风，确保底层硬件轨道从系统层苏醒
            try {
                if(localStream) {
                    localStream.getTracks().forEach(t => t.stop()); // 先杀掉旧流轨道
                }
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                isMuted = false;
                updateMuteUI(false);
            } catch(err) {
                console.error("重置硬件流失败:", err);
            }

            // D. 重构公用 STUN 高打洞抗丢包网络矩阵并建立新的 P2P 握手
            const peerConfig = {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.sipgate.net:3478' },
                        { urls: 'stun:stun.nextcloud.com:443' },
                        { urls: 'stun:stun.stunprotocol.org:3478' },
                        { urls: 'stun:stun.anyfirewall.com:3478' },
                        { urls: 'stun:stun.voipbuster.com' },
                        { urls: 'stun:stun.l.google.com:19302' }
                    ],
                    iceTransportPolicy: 'all
