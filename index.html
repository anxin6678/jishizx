<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信大厅 · 全链路自愈优化版</title>
    <script src="https://npm.elemecdn.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        :root { --wechat-green: #07c160; --wechat-bg: #ededed; }
        body { font-family: sans-serif; background: #222; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .we-box { width: 100vw; height: 100vh; max-width: 500px; background: var(--wechat-bg); display: flex; flex-direction: column; overflow: hidden; }
        
        /* 顶部状态栏 */
        .header { background: #1a1a1a; color: white; padding: 15px; text-align: center; font-size: 0.9em; }
        .net-status { font-size: 0.75em; color: #aaa; margin-top: 5px; }

        /* 聊天区 */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; }
        .msg { background: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; display: inline-block; max-width: 80%; }
        .msg.me { background: var(--wechat-green); color: white; align-self: flex-end; margin-left: auto; }

        /* 输入区 */
        .input-area { padding: 10px; background: #f7f7f7; display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: var(--wechat-green); color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="we-box">
        <div class="header">
            <div>微信大厅</div>
            <div id="net-info" class="net-status">检测网络中...</div>
        </div>
        <div id="chat-box"></div>
        <div class="input-toolbar">
            <button onclick="joinVoice()">🎙️ 开启语音</button>
        </div>
        <div class="input-area">
            <input id="msg-input" placeholder="输入消息...">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <script>
        // === 容灾节点列表 ===
        const nodes = [
            'wss://broker.emqx.io:8084/mqtt',
            'wss://test.mosquitto.org:8081/mqtt'
        ];
        let currentIdx = 0;
        let client;

        function connect() {
            if (currentIdx >= nodes.length) {
                document.getElementById('net-info').innerText = "🔴 网络连接失败，请重试";
                return;
            }
            client = mqtt.connect(nodes[currentIdx]);
            client.on('connect', () => {
                document.getElementById('net-info').innerText = "🟢 网络已连接: " + nodes[currentIdx];
                client.subscribe('chat/lobby');
            });
            client.on('error', () => {
                currentIdx++;
                setTimeout(connect, 1000); // 自动切换节点
            });
        }
        connect();

        async function joinVoice() {
            try {
                // 三级降级策略：标准 -> 无回声 -> 裸流
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
                    .catch(() => navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false } }))
                    .catch(() => navigator.mediaDevices.getUserMedia({ audio: { mandatory: { echoCancellation: false } } }));
                alert("麦克风已成功启用！");
            } catch (e) {
                alert("硬件错误：" + e.name + "。请确认已在系统设置中授权麦克风权限。");
            }
        }

        function sendMsg() {
            const val = document.getElementById('msg-input').value;
            if(!client || !client.connected) {
                alert("网络连接中，系统正在自动切换最佳节点...");
                return;
            }
            client.publish('chat/lobby', val);
            document.getElementById('msg-input').value = '';
        }
    </script>
</body>
</html>
