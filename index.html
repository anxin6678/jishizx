<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信大厅 · 阿里云极速稳定版</title>
    <script src="https://npm.elemecdn.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        :root { --wechat-green: #07c160; --wechat-bg: #f3f3f3; --wechat-panel-bg: #f7f7f7; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #e9e9e9; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; position: fixed; }
        
        .login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #ffffff; width: 100%; max-width: 420px; border-radius: 8px; padding: 30px 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group input { width: 100%; padding: 11px; border: 1px solid #e0e0e0; border-radius: 4px; }
        
        .wechat-container { width: 100vw; height: 100vh; max-width: 1100px; max-height: 850px; background: var(--wechat-bg); display: flex; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .left-panel { width: 320px; background: var(--wechat-panel-bg); border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; }
        .right-panel { flex: 1; display: flex; flex-direction: column; background: var(--wechat-bg); }
        
        .net-status { font-size: 0.8em; font-weight: bold; padding: 5px; }
        .status-online { color: var(--wechat-green); }
        .status-offline { color: #fa5151; }

        #chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        .msg-wrapper { display: flex; gap: 10px; margin-bottom: 15px; }
        .msg-bubble { background: white; padding: 10px; border-radius: 4px; font-size: 0.95em; }
        .msg-wrapper.me { justify-content: flex-end; }
        .msg-wrapper.me .msg-bubble { background: #95ec69; }

        .input-toolbar { background: var(--wechat-panel-bg); padding: 10px; display: flex; flex-direction: column; }
        textarea { width: 100%; height: 60px; resize: none; border: 1px solid #ddd; }
        
        /* 适配手机 */
        @media (max-width: 768px) {
            .wechat-container { flex-direction: column; }
            .left-panel { width: 100%; height: auto; }
            .member-section { display: none; }
        }
    </style>
</head>
<body>

    <div class="login-overlay" id="login-overlay">
        <div class="login-card">
            <h3>进群配置</h3>
            <div class="form-group"><label>房间号</label><input type="text" id="input-room" value="666"></div>
            <div class="form-group"><label>昵称</label><input type="text" id="input-name" placeholder="请输入昵称"></div>
            <button class="we-btn primary" onclick="submitLogin()">进入大厅</button>
        </div>
    </div>

    <div class="wechat-container">
        <div class="left-panel">
            <div class="left-header">
                <h2>微信大厅</h2>
                <div id="net-status-text" class="net-status status-offline">🔴 公屏网络：连接中...</div>
            </div>
            <div class="voice-card">
                <button class="we-btn primary" onclick="joinGlobalVoice()">🚀 开启麦克风</button>
            </div>
            <div id="users-grid"></div>
        </div>
        <div class="right-panel">
            <div id="chat-box"></div>
            <div class="input-toolbar">
                <textarea id="msg-input" placeholder="输入内容..."></textarea>
                <button onclick="sendTextMsg()">发送</button>
            </div>
        </div>
    </div>

    <script>
        let roomId, myId, mqttClient;
        const ROOM_TOPIC = 'wechat-lobby-pro-v1/';

        function submitLogin() {
            roomId = document.getElementById('input-room').value.trim();
            myId = document.getElementById('input-name').value.trim() || '用户' + Math.floor(Math.random()*1000);
            document.getElementById('login-overlay').style.display = 'none';
            initMqtt();
        }

        function initMqtt() {
            // 使用阿里云物联网平台公共网关，走标准 443 端口，极难被墙
            const broker = 'wss://public.mqtt.iothub.aliyuncs.com:443/mqtt';
            mqttClient = mqtt.connect(broker, { 
                keepalive: 20, 
                reconnectPeriod: 1000, // 激进重连：断开后每秒尝试重连
                connectTimeout: 5000 
            });

            mqttClient.on('connect', () => {
                document.getElementById('net-status-text').innerText = "🟢 公屏网络：已连接";
                document.getElementById('net-status-text').className = "net-status status-online";
                mqttClient.subscribe(ROOM_TOPIC + roomId + '/chat');
            });

            mqttClient.on('message', (topic, message) => {
                const data = JSON.parse(message.toString());
                renderMessage(data.text, 'peer');
            });
        }

        function sendTextMsg() {
            const text = document.getElementById('msg-input').value;
            if (!text) return;
            if (!mqttClient || !mqttClient.connected) return alert("网络连接中，请稍候！");
            mqttClient.publish(ROOM_TOPIC + roomId + '/chat', JSON.stringify({text: text}));
            renderMessage(text, 'me');
            document.getElementById('msg-input').value = '';
        }

        function renderMessage(text, type) {
            const chatBox = document.getElementById('chat-box');
            const wrapper = document.createElement('div');
            wrapper.className = `msg-wrapper ${type}`;
            wrapper.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function joinGlobalVoice() {
            try {
                // 彻底降级：强制禁用高级特征，获取最原始的音频硬件访问权限
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });
                alert("麦克风已成功开启！");
            } catch (err) {
                alert("硬件权限或设备错误：" + err.message);
            }
        }
    </script>
</body>
</html>
