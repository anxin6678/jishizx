<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Web聊天大厅</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-window { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
        .controls { padding: 10px; background: #eee; }
        .user-card { border: 1px solid #ddd; padding: 5px; margin: 5px; display: inline-block; }
    </style>
</head>
<body>

    <div id="login">
        <input type="text" id="username" placeholder="请输入昵称">
        <button onclick="initChat()">进入聊天室</button>
    </div>

    <div id="app" style="display:none;">
        <div id="user-list"></div>
        <div id="chat-window"></div>
        <div class="controls">
            <button onclick="toggleMic()">静音麦克风</button>
            <input type="text" id="msgInput">
            <button onclick="sendText()">发送</button>
        </div>
    </div>

    <script>
        let peer, myStream, localName;

        async function initChat() {
            localName = document.getElementById('username').value || "福福的小老弟";
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';

            // 获取位置
            fetch('https://ipapi.co/json/').then(res => res.json()).then(data => {
                console.log("所在地区:", data.city, data.country_name);
            });

            // 初始化PeerJS
            peer = new Peer(); // 使用公共服务器
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            peer.on('call', call => {
                call.answer(myStream);
            });
        }

        function toggleMic() {
            myStream.getAudioTracks()[0].enabled = !myStream.getAudioTracks()[0].enabled;
            alert("麦克风已切换");
        }

        // 注意：由于没有服务器，文字/图片通过 PeerJS 的 dataConnection 广播
        // 表情包可使用 <img> 标签引入微信表情静态图库即可
    </script>
</body>
</html>
