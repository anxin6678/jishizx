<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Web (Demo)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body, html { height: 100%; width: 100%; background-color: #17212b; color: #f5f5f5; overflow: hidden; }

    /* --- Modal Auth View --- */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0e1621; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .auth-card { background: #17212b; padding: 32px; border-radius: 12px; width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; }
    .auth-card h2 { margin-bottom: 24px; color: #f5f5f5; font-size: 22px; }
    .auth-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #242f3d; border: 1px solid #0e1621; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    .auth-input:focus { border-color: #5288c1; }
    .auth-btn { width: 100%; padding: 12px; background: #5288c1; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .auth-btn:hover { background: #4676a9; }
    .auth-toggle { margin-top: 16px; font-size: 13px; color: #6c7883; cursor: pointer; }
    .auth-toggle span { color: #5288c1; }

    /* --- Telegram Main Layout --- */
    .app-container { display: flex; width: 100vw; height: 100vh; }
    
    /* Left Sidebar */
    .sidebar { width: 350px; background: #17212b; border-right: 1px solid #0e1621; display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0e1621; }
    .user-badge { font-weight: 600; color: #5288c1; font-size: 15px; }
    .logout-btn { background: transparent; border: none; color: #e53935; cursor: pointer; font-size: 13px; }
    
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; transition: background 0.15s; }
    .chat-item:hover, .chat-item.active { background: #2b5278; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #5288c1; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin-right: 12px; flex-shrink: 0; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .chat-time { font-size: 12px; color: #6c7883; font-weight: normal; }
    .chat-preview { font-size: 13px; color: #7f91a4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Right Main Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0e1621; }
    .chat-header { height: 56px; background: #17212b; padding: 0 20px; display: flex; align-items: center; border-bottom: 1px solid #0e1621; }
    .chat-title { font-size: 16px; font-weight: 600; }
    
    .message-viewport { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#17212b 1px, transparent 0); background-size: 16px 16px; }
    .message { max-width: 60%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
    .message.incoming { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.outgoing { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-time { font-size: 10px; color: #7f91a4; float: right; margin-top: 4px; margin-left: 8px; }

    .input-area { padding: 12px 20px; background: #17212b; display: flex; gap: 12px; align-items: center; }
    .message-input { flex: 1; padding: 12px 16px; background: #242f3d; border: none; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .send-btn { background: none; border: none; color: #5288c1; font-weight: 600; cursor: pointer; padding: 8px 16px; }
    .send-btn:hover { color: #649cd6; }
  </style>
</head>
<body>

  <!-- 注册/登录弹窗 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h2 id="authTitle">注册 Telegram</h2>
      <input type="text" id="authUsername" class="auth-input" placeholder="输入用户名">
      <input type="password" id="authPassword" class="auth-input" placeholder="输入密码">
      <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">创建账号</button>
      <div class="auth-toggle" onclick="toggleAuthMode()">
        <span id="authToggleText">已有账号？点击登录</span>
      </div>
    </div>
  </div>

  <!-- 主界面 -->
  <div class="app-container">
    <!-- 边栏：会话列表 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="user-badge" id="currentUserDisplay">未登录</span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
      <div class="chat-list">
        <div class="chat-item active">
          <div class="avatar">TG</div>
          <div class="chat-info">
            <div class="chat-name">Telegram 官方通知 <span class="chat-time">12:00</span></div>
            <div class="chat-preview">欢迎使用全新 Web 客户端！</div>
          </div>
        </div>
        <div class="chat-item">
          <div class="avatar" style="background-color: #43a047;">注</div>
          <div class="chat-info">
            <div class="chat-name">文件传输助手 <span class="chat-time">10:30</span></div>
            <div class="chat-preview">[文本消息]</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主聊天区域 -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-title">Telegram 官方通知</div>
      </div>
      <div class="message-viewport" id="messageViewport">
        <div class="message incoming">
          欢迎使用高度还原的 Telegram 静态客户端。
          <span class="message-time">12:00</span>
        </div>
        <div class="message incoming">
          您的账号凭据已安全存储在浏览器的 LocalStorage 中。
          <span class="message-time">12:01</span>
        </div>
      </div>
      <div class="input-area">
        <input type="text" class="message-input" id="msgInput" placeholder="发送消息..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>

  <script>
    let isLoginMode = false;

    // 页面加载检查登录状态
    window.onload = function() {
      const activeUser = localStorage.getItem('tg_active_user');
      if (activeUser) {
        showApp(activeUser);
      }
    };

    // 切换登录/注册模式
    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      document.getElementById('authTitle').innerText = isLoginMode ? '登录 Telegram' : '注册 Telegram';
      document.getElementById('authSubmitBtn').innerText = isLoginMode ? '登录' : '创建账号';
      document.getElementById('authToggleText').innerText = isLoginMode ? '没有账号？点击注册' : '已有账号？点击登录';
    }

    // 账号逻辑 (LocalStorage 操作)
    function handleAuth() {
      const username = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      if (!username || !password) {
        alert('请完整填写用户名和密码！');
        return;
      }

      // 获取当前数据库
      const users = JSON.parse(localStorage.getItem('tg_users') || '{}');

      if (isLoginMode) {
        // 登录逻辑
        if (users[username] && users[username].password === password) {
          localStorage.setItem('tg_active_user', username);
          showApp(username);
        } else {
          alert('用户名或密码错误！');
        }
      } else {
        // 注册逻辑
        if (users[username]) {
          alert('用户名已存在！');
          return;
        }
        users[username] = { password: password, createdAt: new Date().toISOString() };
        localStorage.setItem('tg_users', JSON.stringify(users));
        localStorage.setItem('tg_active_user', username);
        alert('账号创建成功！');
        showApp(username);
      }
    }

    // 进入主界面
    function showApp(username) {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('currentUserDisplay').innerText = '@' + username;
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('tg_active_user');
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('authUsername').value = '';
      document.getElementById('authPassword').value = '';
    }

    // 发送消息逻辑
    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const viewport = document.getElementById('messageViewport');
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message outgoing';
      msgDiv.innerHTML = `${escapeHtml(text)} <span class="message-time">${timeStr}</span>`;
      
      viewport.appendChild(msgDiv);
      input.value = '';
      viewport.scrollTop = viewport.scrollHeight;
    }

    // 转义 XSS 字符
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
