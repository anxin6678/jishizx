<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5eafa">
  <title>手工活咨询 | 手作</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #442b55;
      background: #f5eafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 48px 20px;
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 215, 227, .9), transparent 34%),
        radial-gradient(circle at 90% 48%, rgba(200, 201, 255, .8), transparent 38%),
        linear-gradient(160deg, #fff4f3, #f3e7fb 52%, #e8e7ff);
    }

    .content {
      width: min(100%, 480px);
      margin: 0 auto;
      text-align: center;
    }

    .label {
      display: inline-block;
      margin: 0 0 18px;
      padding: 7px 15px;
      border: 1px solid rgba(154, 96, 165, .2);
      border-radius: 999px;
      color: #9861a3;
      background: rgba(255, 255, 255, .55);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      color: #5b326b;
      font-size: clamp(32px, 8vw, 44px);
      line-height: 1.25;
      letter-spacing: .06em;
    }

    .intro {
      margin: 14px 0 28px;
      color: #806b89;
      font-size: 16px;
      line-height: 1.8;
    }

    .card {
      padding: 28px 24px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 28px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 18px 50px rgba(104, 70, 127, .12);
    }

    .card h2 {
      margin: 0;
      color: #653d78;
      font-size: 21px;
    }

    .card p {
      margin: 9px 0 20px;
      color: #86748e;
      font-size: 14px;
      line-height: 1.7;
    }

    .code {
      position: relative;
      overflow: hidden;
      width: min(100%, 300px);
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 12px;
      background: #fff;
    }

    .code img {
      position: absolute;
      top: -67.68%;
      left: -67.99%;
      display: block;
      width: 234.15%;
      max-width: none;
      height: auto;
    }

    .save {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 26px;
      border-radius: 999px;
      color: #fff;
      background: #9063ac;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .save:hover,
    .save:focus-visible {
      background: #754d91;
    }

    .steps {
      margin: 25px 0 0;
      color: #765f80;
      font-size: 14px;
      line-height: 1.9;
    }

    .steps strong {
      color: #744980;
    }

    .notice {
      margin: 20px 0 0;
      color: #95849c;
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .page {
        padding: 36px 18px;
      }

      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <header>
        <p class="label">手作 · 轻松咨询</p>
        <h1>手工活咨询</h1>
        <p class="intro">一份手作，一份用心<br>扫码了解手工活详情</p>
      </header>

      <section class="card" aria-labelledby="scan-title">
        <h2 id="scan-title">微信扫码进入咨询</h2>
        <p>使用微信扫一扫，了解具体信息</p>
        <div class="code">
          <img src="handwork.png" alt="手工活咨询微信小程序码">
        </div>
        <a class="save" href="handwork.png" download="手工活咨询.png">保存图片</a>
      </section>

      <p class="steps"><strong>手机使用：</strong>保存图片后，打开微信扫一扫<br>从相册选择图片，即可识别咨询码</p>
      <p class="notice">具体工作内容及合作方式，请扫码咨询了解。</p>
    </div>
  </main>
</body>
</html>
