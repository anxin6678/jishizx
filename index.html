<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P 极简加密私聊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .chat-card { width: 100%; max-width: 480px; height: 90vh; max-height: 680px; background: #1e293b; border-radius: 16px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .header { padding: 16px; background: #0f172a; border-bottom: 1px solid #334155; text-align: center; }
    .header h2 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 8px; }
    .my-id-box { display: inline-flex; align-items: center; gap: 8px; background: #1e293b; padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; font-size: 0.85rem; }
    .my-id-box code { color: #f43f5e; font-weight: bold; user-select: all; }
    .copy-btn { background: #334155; border: none; color: #f8fafc; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    .connect-bar { display: flex; gap: 8px; padding: 12px; background: #0f172a; border-bottom: 1px solid #334155; }
    .connect-bar input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 0.85rem; outline: none; }
    .connect-bar button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    
    .status-tag { padding: 6px; text-align: center; font-size: 0.75rem; background: #334155; color: #94a3b8; transition: all 0.3s; }
    .status-tag.online { background: #065f46; color: #34d399; }

    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg.me { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 2px; }
    .msg.peer { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .msg.system { align-self: center; background: transparent; color: #64748b; font-size: 0.75rem; }

    .input-bar { display: flex; padding: 12px; background: #0f172a; gap: 8px; border-top: 1px solid #334155; }
    .input-bar input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
    .input-bar button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .input-bar button:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }
  </style>
  
  <!-- 引入 PeerJS 官方 CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="chat-card">
    <div class="header">
      <h2>P2P 匿名点对点私聊</h2>
      <div class="my-id-box">
        我的 ID: <code id="my-id">生成中...</code>
        <button class="copy-btn" onclick="copyMyId()">复制</button>
      </div>
    </div>

    <div class="connect-bar">
      <input type="text" id="target-id" placeholder="输入对方的 ID...">
      <button onclick="connectToPeer()">连接对方</button>
    </div>

    <div class="status-tag" id="status">未建立连接</div>

    <div class="messages-box" id="messages">
      <div class="msg system">提示：双方必须同时打开网页才能建立连接通信</div>
    </div>

    <div class="input-bar">
      <input type="text" id="msg-input" placeholder="请输入消息..." disabled onkeydown="if(event.key==='Enter') sendMsg()">
      <button id="send-btn" onclick="sendMsg()" disabled>发送</button>
    </div>
  </div>

  <script>
    let peer = null;
    let conn = null;

    const myIdEl = document.getElementById('my-id');
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    // 1. 初始化 PeerJS（生成随机 6 位 ID 以便手动输入）
    const customId = Math.random().toString(36).substring(2, 8);
    peer = new Peer(customId);

    // 监听 Peer 初始化完成，获取本地 ID
    peer.on('open', (id) => {
      myIdEl.innerText = id;
    });

    // 监听来自对方的入站连接 (被动连接)
    peer.on('connection', (incomingConn) => {
      if (conn) {
        incomingConn.close(); // 限制仅支持 1v1 私聊
        return;
      }
      conn = incomingConn;
      setupConnectionEvents();
    });

    peer.on('error', (err) => {
      appendSystemMsg(`错误: ${err.type}`);
    });

    // 2. 主动发起连接
    function connectToPeer() {
      const targetId = document.getElementById('target-id').value.trim();
      if (!targetId) return alert('请输入对方的 ID');
      if (targetId === peer.id) return alert('不能连接你自己');

      appendSystemMsg(`正在连接到 ${targetId}...`);
      conn = peer.connect(targetId);
      setupConnectionEvents();
    }

    // 3. 统一处理连接成功、接收消息、断开连接事件
    function setupConnectionEvents() {
      conn.on('open', () => {
        statusEl.innerText = `已与 [${conn.peer}] 建立加密连接`;
        statusEl.classList.add('online');
        msgInput.disabled = false;
        sendBtn.disabled = false;
        appendSystemMsg('WebRTC P2P 直连成功，可以开始聊天了！');
      });

      // 接收来自对方发来的数据
      conn.on('data', (data) => {
        appendMsg(data, 'peer');
      });

      // 连接断开
      conn.on('close', () => {
        statusEl.innerText = '连接已断开';
        statusEl.classList.remove('online');
        msgInput.disabled = true;
        sendBtn.disabled = true;
        appendSystemMsg('对方退出了聊天或连接已中断');
        conn = null;
      });
    }

    // 4. 发送消息
    function sendMsg() {
      const text = msgInput.value.trim();
      if (!text || !conn) return;

      conn.send(text);
      appendMsg(text, 'me');
      msgInput.value = '';
    }

    // UI 绘制辅助工具
    function appendMsg(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('msg', type);
      msgDiv.innerText = text;
      messagesEl.appendChild(msgDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendSystemMsg(text) {
      appendMsg(text, 'system');
    }

    function copyMyId() {
      const idText = myIdEl.innerText;
      if (idText && idText !== '生成中...') {
        navigator.clipboard.writeText(idText);
        alert('ID 已复制到剪贴板！');
      }
    }
  </script>
</body>
</html>
