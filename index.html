<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10172c">
  <title>蜘蛛骑士 · 夜行自行车</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #10172c;
      color: #f5f2e9;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 105%, rgba(84, 105, 121, .2), transparent 52%),
        #10172c;
    }

    .scene {
      width: min(100vw, 1100px);
      padding: 22px;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 28px;
      background: #17213b;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 20px 26px 15px;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: #a6b4c9;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 25px);
      letter-spacing: .02em;
    }

    .toggle {
      flex: 0 0 auto;
      padding: 10px 15px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      background: rgba(255, 255, 255, .08);
      color: #f5f2e9;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .toggle:hover { background: rgba(255, 255, 255, .15); }
    .toggle:active { transform: scale(.97); }
    .toggle:focus-visible { outline: 3px solid #ffc96b; outline-offset: 3px; }

    .art {
      display: block;
      width: 100%;
      height: auto;
      background: #192644;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 26px 18px;
      color: #a6b4c9;
      font-size: 12px;
    }

    .caption span:last-child { color: #f5c46b; }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1.15s linear infinite;
    }

    .pedal-spin {
      transform-box: view-box;
      transform-origin: 470px 440px;
      animation: spin 1.15s linear infinite;
    }

    .rider-bob { animation: bob 1.15s ease-in-out infinite; }

    .drift { animation: drift 4s linear infinite; }
    .drift-slow { animation: drift 15s linear infinite; }

    .paused *,
    .paused *::before,
    .paused *::after {
      animation-play-state: paused !important;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-220px); } }

    @media (max-width: 600px) {
      .scene { padding: 12px; }
      .card { border-radius: 20px; }
      .topline { padding: 16px 17px 12px; }
      .caption { padding: 11px 17px 15px; font-size: 11px; }
      .toggle { padding: 9px 12px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card:not(.motion-allowed) * { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="card" aria-labelledby="page-title">
      <header class="topline">
        <div>
          <p class="eyebrow">Midnight ride · No. 08</p>
          <h1 id="page-title">蜘蛛骑士的夜行</h1>
        </div>
        <button class="toggle" id="toggle" type="button" aria-pressed="false">暂停动画</button>
      </header>

      <svg class="art" viewBox="0 0 960 600" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="svg-title">一只戴着头盔的蜘蛛骑着自行车穿过月夜</title>
        <desc id="svg-desc">月亮、星星和远处的山丘组成夜景。蜘蛛骑手踩着踏板，车轮和背景持续运动。</desc>

            <stop offset="1" stop-color="#fff5c9" stop-opacity="0"/>
          </radialGradient>
          <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="9"/>
          </filter>
        </defs>

        <rect width="960" height="600" fill="url(#sky)"/>

        <circle cx="756" cy="142" r="38" fill="#ffe9a8"/>
        <circle cx="770" cy="130" r="35" fill="#263250" opacity=".22"/>

        <g fill="#fff1c7">

          <circle cx="354" cy="77" r="2.1"/><circle cx="450" cy="132" r="1.5"/>
          <circle cx="592" cy="82" r="1.8"/><circle cx="872" cy="236" r="1.6"/>

          <path d="M288 115v10m-5-5h10M852 95v9m-4.5-4.5h9" stroke="#fff1c7" stroke-width="1.5" stroke-linecap="round"/>

        <path d="M0 452h960v148H0Z" fill="url(#road)"/>
        <path d="M0 451h960" stroke="#91a2ae" stroke-opacity=".42" stroke-width="3"/>

        <g class="drift-slow" fill="#192b3e" opacity=".8">
          <path d="M62 449v-54h8v54m-15-39h38v7H55Zm-3-7h45l-8-18H60Z"/>

          <path d="M825 449v-60h8v60m-15-41h38v7h-38Zm-3-7h44l-8-18h-28Z"/>

          <path d="M682 449q8-34 17 0m-5 0q8-49 17 0m-5 0q8-29 17 0"/>

        </g>
        <g class="drift" opacity=".55" stroke="#f4c970" stroke-linecap="round">
          <path d="M80 502h94m40 0h44m570 0h100" stroke-width="5"/>

        </g>

              <g class="wheel-spin" stroke="#a9bbc4" stroke-width="1.6">
                <path d="M0-87V87M-87 0H87M-61.5-61.5l123 123m0-123-123 123"/>

            </g>
            <g transform="translate(610 440)">
              <circle r="91" stroke="#d9e3e5" stroke-width="5"/>
              <g class="wheel-spin" stroke="#a9bbc4" stroke-width="1.6">
                <path d="M0-87V87M-87 0H87M-61.5-61.5l123 123m0-123-123 123"/>
                <path d="M-33-80 33 80M33-80-33 80M-80-33 80 33M-80 33 80-33"/>
                <circle cx="0" cy="-78" r="5" fill="#ffc970" stroke="none"/>

              <circle r="7" fill="#f3c66e" stroke="none"/>

          <path d="M414 269q-17 20-20 42l18 6q14-19 27-27" fill="none" stroke="#27334d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M490 252q21 13 30 39l16 27" fill="none" stroke="#27334d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="540" cy="319" r="5" fill="#f4c970"/>

          <ellipse cx="466" cy="222" rx="30" ry="34" fill="#26334e" stroke="#f4c970" stroke-width="3"/>
          <path d="M446 217q3-16 20-17t21 17" fill="#fff0d0"/>
          <ellipse cx="456" cy="220" rx="5" ry="7" fill="#26334e"/>
          <ellipse cx="476" cy="220" rx="5" ry="7" fill="#26334e"/>
          <path d="M462 233q5 4 10 0" fill="none" stroke="#f08d76" stroke-width="2" stroke-linecap="round"/>
          <path d="M436 211q4-30 31-31 25 2 30 31l-8 7q-20-10-45 0Z" fill="#f1b85f" stroke="#ffe0a0" stroke-width="3"/>
          <path d="M443 209q23-10 48-1" fill="none" stroke="#fff0c9" stroke-width="4" stroke-linecap="round"/>
          <path d="M457 188q11-9 22 0" fill="none" stroke="#fff0c9" stroke-width="2" opacity=".8"/>
        </g>

        <g transform="translate(713 315)">
          <path d="M0 24q-8-19 0-27 8 8 0 27Zm0 0q-20-8-25 1 11 9 25-1Zm0 0q20-8 25 1-11 9-25-1Z" fill="#f7c66e" opacity=".9"/>
          <circle r="4" fill="#fff2bb" filter="url(#softGlow)"/>

      </svg>

      <footer class="caption">
        <span>夜风正好，八条腿都在认真踩踏。</span>
        <span>月亮也在陪骑 ✦</span>
      </footer>
    </section>
  </main>

  <script>
    const card = document.querySelector(".card");
    const toggle = document.querySelector("#toggle");
    const frontLeg = document.querySelector("#front-leg");
    const backLeg = document.querySelector("#back-leg");
    const frontFoot = document.querySelector("#front-foot");
    const backFoot = document.querySelector("#back-foot");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let paused = reducedMotion.matches;
    let elapsed = 0;
    let lastFrame = null;
    let frameId = null;

    function drawLegs() {
      const angle = elapsed / 1150 * Math.PI * 2;
      const x = Math.sin(angle) * 33;
      const y = Math.cos(angle) * 33;
      const frontX = 470 + x;
      const frontY = 440 - y;
      const backX = 470 - x;
      const backY = 440 + y;

      frontLeg.setAttribute("d", `M449 273 L${(449 + frontX) / 2 - 25} ${(273 + frontY) / 2} L${frontX} ${frontY}`);
      backLeg.setAttribute("d", `M475 272 L${(475 + backX) / 2 + 25} ${(272 + backY) / 2} L${backX} ${backY}`);
      frontFoot.setAttribute("d", `M${frontX - 13} ${frontY}h26`);
      backFoot.setAttribute("d", `M${backX - 13} ${backY}h26`);
    }

    function animate(time) {
      if (lastFrame !== null) elapsed += time - lastFrame;
      lastFrame = time;
      drawLegs();
      frameId = requestAnimationFrame(animate);
    }

    function updatePlayback() {
      card.classList.toggle("paused", paused);
      toggle.textContent = paused ? "播放动画" : "暂停动画";
      toggle.setAttribute("aria-pressed", String(paused));
      if (paused) {
        cancelAnimationFrame(frameId);
        frameId = null;
        lastFrame = null;
      } else {
        frameId = requestAnimationFrame(animate);
      }
    }

    toggle.addEventListener("click", () => {
      paused = !paused;
      card.classList.add("motion-allowed");
      updatePlayback();
    });

    drawLegs();
    updatePlayback();
  </script>
</body>
</html>
