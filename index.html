<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord 大厅 - 移动适配版</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #313338; color: #dbdee1; font-family: sans-serif; }
        .discord-scrollbar::-webkit-scrollbar { width: 6px; }
        .discord-scrollbar::-webkit-scrollbar-track { background: #2b2d31; }
        .discord-scrollbar::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 3px; }
        /* 避免 iOS 滚动橡皮筋效应破坏全屏体验 */
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; }
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden select-none">

    <div id="login-overlay" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-[#313338] w-full max-w-md rounded-lg p-5 sm:p-6 shadow-2xl border border-gray-700 text-center">
            <h2 class="text-xl sm:text-2xl font-bold text-white mb-2">欢迎来到通讯大厅</h2>
            <p class="text-gray-400 text-xs sm:text-sm mb-4 sm:mb-6">请输入你的昵称并选择头像</p>
            
            <input id="username-input" type="text" placeholder="不填默认：福福的小老弟" 
                   class="w-full bg-[#1e1f22] border border-transparent focus:border-[#5865f2] rounded p-3 text-white outline-none mb-4 transition text-sm">
            
            <p class="text-left text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">随机生成的系统头像</p>
            <div class="flex justify-center mb-6">
                <img id="preview-avatar" src="" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border-4 border-[#5865f2] bg-gray-600 object-cover">
            </div>

            <button id="join-btn" class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-medium py-3 rounded transition duration-200 text-sm">
                进入大厅
            </button>
        </div>
    </div>

    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/60 z-30 md:hidden transition-opacity duration-300"></div>

    <div class="flex flex-1 w-full h-full relative">
        
        <div id="left-sidebar" class="fixed inset-y-0 left-0 z-40 flex transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300 ease-in-out h-full">
            <div class="w-16 bg-[#1e1f22] flex flex-col items-center py-3 gap-2 flex-shrink-0">
                <div class="w-10 h-10 bg-[#5865f2] rounded-[12px] flex items-center justify-center text-white font-bold cursor-pointer">
                    <i class="fa-brands fa-discord text-lg"></i>
                </div>
                <div class="w-8 h-[2px] bg-[#35363c] rounded my-1"></div>
                <div class="w-10 h-10 bg-[#313338] text-[#23a55a] rounded-full flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                </div>
            </div>

            <div class="w-52 bg-[#2b2d31] flex flex-col justify-between flex-shrink-0 border-r border-[#1f2023]/30">
                <div>
                    <div class="h-12 border-b border-[#1f2023] flex items-center justify-between px-3 font-bold text-white text-sm shadow-sm">
                        <span class="truncate">福福的专属基地</span>
                        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
                    </div>
                    <div class="p-2">
                        <div class="flex items-center text-gray-400 text-[10px] font-bold uppercase tracking-wider px-1 py-1">
                            <i class="fa-solid fa-chevron-down mr-1 text-[8px]"></i> 综合频道
                        </div>
                        <div class="flex items-center justify-between bg-[#404249] text-white px-2 py-1.5 rounded my-1 cursor-pointer">
                            <div class="flex items-center gap-1.5 overflow-hidden">
                                <span class="text-gray-400 font-light text-base">#</span>
                                <span class="font-medium text-xs truncate">通讯大厅 (强制)</span>
                            </div>
                            <i class="fa-solid fa-volume-high text-[10px] text-[#23a55a]"></i>
                        </div>
                    </div>
                </div>

                <div class="h-14 bg-[#232428] flex items-center justify-between px-2">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <img id="local-avatar" src="" class="w-8 h-8 rounded-full bg-gray-500 object-cover flex-shrink-0">
                        <div class="flex flex-col overflow-hidden">
                            <span id="local-name" class="text-white text-xs font-bold truncate">未登录</span>
                            <span id="local-region" class="text-gray-400 text-[10px] truncate">探测中...</span>
                        </div>
                    </div>
                    <div class="flex gap-0.5 text-gray-400">
                        <button id="mic-toggle-btn" class="w-7 h-7 hover:bg-[#35373c] hover:text-white rounded flex items-center justify-center transition">
                            <i id="mic-icon" class="fa-solid fa-microphone text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 bg-[#313338] flex flex-col justify-between h-full w-full min-w-0 relative z-10">
            <div class="h-12 border-b border-[#1f2023] flex items-center justify-between px-3 shadow-sm flex-shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                    <button id="menu-toggle-btn" class="md:hidden text-gray-400 hover:text-white p-1 pr-2">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <span class="text-gray-400 font-light text-xl">#</span>
                    <span class="text-white font-bold text-sm truncate">通讯大厅</span>
                    <div class="hidden sm:block w-[1px] h-4 bg-gray-600 mx-1"></div>
                    <span class="hidden sm:inline text-gray-400 text-xs truncate">纯前端大乱斗连麦大厅</span>
                </div>
                
                <button id="members-toggle-btn" class="md:hidden text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-user-group text-sm"></i>
                </button>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-3 space-y-3 discord-scrollbar">
                <div class="text-center text-[11px] text-gray-500 my-2 border-b border-gray-700/30 pb-2">
                    欢迎来到由纯前端搭建的移动自适应 Discord。
                </div>
            </div>

            <div class="p-3 pt-0 flex-shrink-0 relative">
                <div id="emoji-picker" class="hidden absolute bottom-14 left-3 right-3 sm:right-auto bg-[#2b2d31] border border-gray-700 rounded-lg p-2.5 shadow-2xl z-20">
                    <p class="text-[11px] font-bold text-gray-400 mb-2">微信常用系统表情</p>
                    <div id="emoji-grid" class="grid grid-cols-7 sm:grid-cols-8 gap-2 text-xl max-h-40 overflow-y-auto discord-scrollbar"></div>
                </div>

                <div class="bg-[#383a40] rounded-lg flex items-center px-3 py-2 gap-2">
                    <label class="cursor-pointer text-gray-400 hover:text-white transition p-1">
                        <i class="fa-solid fa-circle-plus text-base"></i>
                        <input id="image-input" type="file" accept="image/*" class="hidden">
                    </label>
                    
                    <input id="message-input" type="text" placeholder="发送消息..." 
                           class="bg-transparent flex-1 outline-none text-white placeholder-gray-500 text-xs sm:text-sm py-1">
                    
                    <button id="emoji-btn" class="text-gray-400 hover:text-white transition p-1">
                        <i class="fa-regular fa-face-smile text-base"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="right-sidebar" class="fixed inset-y-0 right-0 z-40 w-56 bg-[#2b2d31] p-3 transform translate-x-full md:translate-x-0 md:relative md:flex flex-col h-full transition-transform duration-300 ease-in-out border-l border-[#1f2023]/30">
            <h3 class="text-gray-400 text-[10px] font-bold uppercase tracking-wider mb-2">在线人员 — <span id="member-count">0</span></h3>
            <div id="member-list" class="space-y-1 overflow-y-auto flex-1 discord-scrollbar"></div>
        </div>
    </div>

    <div id="remote-audios" class="hidden"></div>

    <script>
        // --- 全局变量与配置 ---
        const ROOM_ID = "fufu_secret_global_lobby_2026"; 
        const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt"; 
        
        let myId = "user_" + Math.random().toString(36).substr(2, 9);
        let myName = "福福的小老弟";
        let myAvatar = "";
        let myRegion = "中国大陆";
        let isMuted = false;
        
        let mqttClient = null;
        let peer = null;
        let localStream = null;
        let activePeers = {}; 

        const wechatEmojis = ["😀","😁","😂","🤣","😅","😊","😍","😘","😜","😎","😭","😡","😱","😓","😴","😷","🤔","🤫","👻","🤡","💩","👍","👎","👏","🤝","🔥","🎉","❤️"];
        const sampleAvatars = [
            "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=60",
            "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=60"
        ];
        myAvatar = sampleAvatars[Math.floor(Math.random() * sampleAvatars.length)];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("preview-avatar").src = myAvatar;
            initEmojiPicker();
            detectRegion();
            initMobileControllers(); // 注入移动端菜单控制核心
            
            document.getElementById("join-btn").addEventListener("click", () => {
                const inputVal = document.getElementById("username-input").value.trim();
                if(inputVal) myName = inputVal;
                
                document.getElementById("local-name").innerText = myName;
                document.getElementById("local-avatar").src = myAvatar;
                document.getElementById("login-overlay").remove();
                
                startMediaAndConnect();
            });

            document.getElementById("message-input").addEventListener("keydown", (e) => {
                if(e.key === "Enter") sendTextMessage();
            });

            document.getElementById("mic-toggle-btn").addEventListener("click", toggleLocalMic);
            document.getElementById("image-input").addEventListener("change", sendImageMessage);
            document.getElementById("emoji-btn").addEventListener("click", () => {
                document.getElementById("emoji-picker").classList.toggle("hidden");
            });
        });

        // --- 移动端特定的交互逻辑（抽屉开关控制） ---
        function initMobileControllers() {
            const leftSidebar = document.getElementById("left-sidebar");
            const rightSidebar = document.getElementById("right-sidebar");
            const backdrop = document.getElementById("sidebar-backdrop");

            const menuToggle = document.getElementById("menu-toggle-btn");
            const membersToggle = document.getElementById("members-toggle-btn");

            function closeAllSidebars() {
                leftSidebar.classList.add("-translate-x-full");
                rightSidebar.classList.add("translate-x-full");
                backdrop.classList.add("hidden");
            }

            menuToggle.addEventListener("click", (e) => {
                e.stopPropagation();
                rightSidebar.classList.add("translate-x-full"); // 先关右边
                leftSidebar.classList.toggle("-translate-x-full");
                if (!leftSidebar.classList.contains("-translate-x-full")) {
                    backdrop.classList.remove("hidden");
                } else {
                    backdrop.classList.add("hidden");
                }
            });

            membersToggle.addEventListener("click", (e) => {
                e.stopPropagation();
                leftSidebar.classList.add("-translate-x-full"); // 先关左边
                rightSidebar.classList.toggle("translate-x-full");
                if (!rightSidebar.classList.contains("translate-x-full")) {
                    backdrop.classList.remove("hidden");
                } else {
                    backdrop.classList.add("hidden");
                }
            });

            // 点击遮罩层或者聊天区域，自动收起所有抽屉
            backdrop.addEventListener("click", closeAllSidebars);
            document.getElementById("chat-messages").addEventListener("click", () => {
                closeAllSidebars();
                document.getElementById("emoji-picker").classList.add("hidden");
            });
        }

        // --- 地理位置与表情包处理 ---
        function detectRegion() {
            fetch('https://api.db-ip.com/v2/free/self')
                .then(res => res.json())
                .then(data => {
                    if (data.city || data.province || data.countryName) {
                        myRegion = data.city || data.province || data.countryName;
                    }
                    document.getElementById("local-region").innerText = myRegion;
                })
                .catch(() => {
                    document.getElementById("local-region").innerText = "中国大陆";
                });
        }

        function initEmojiPicker() {
            const grid = document.getElementById("emoji-grid");
            wechatEmojis.forEach(emoji => {
                const span = document.createElement("span");
                span.innerText = emoji;
                span.className = "cursor-pointer p-1.5 hover:bg-gray-600 rounded text-center transition select-none active:bg-gray-700";
                span.onclick = () => {
                    document.getElementById("message-input").value += emoji;
                    document.getElementById("emoji-picker").classList.add("hidden");
                };
                grid.appendChild(span);
            });
        }

        // --- P2P 音频与通讯逻辑 ---
        async function startMediaAndConnect() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                console.warn("麦克风不可用，自动切为听众模式。", err);
                document.getElementById("mic-icon").className = "fa-solid fa-microphone-slash text-red-500";
                isMuted = true;
            }

            peer = new Peer(myId);
            peer.on('open', () => { connectMQTT(); });
            peer.on('call', (call) => {
                call.answer(localStream);
                handleIncomingCall(call);
            });
        }

        function connectMQTT() {
            mqttClient = mqtt.connect(MQTT_BROKER);
            mqttClient.on("connect", () => {
                mqttClient.subscribe(`lobby/${ROOM_ID}/chat`);
                mqttClient.subscribe(`lobby/${ROOM_ID}/presence`);
                mqttClient.subscribe(`lobby/${ROOM_ID}/cmd/${myId}`);
                startHeartbeat();
            });

            mqttClient.on("message", (topic, message) => {
                const payload = JSON.parse(message.toString());
                if (topic.endsWith('/chat')) {
                    displayMessage(payload);
                } else if (topic.endsWith('/presence')) {
                    handlePresence(payload);
                } else if (topic.includes(`/cmd/${myId}`)) {
                    handleCommand(payload);
                }
            });
        }

        function startHeartbeat() {
            const sendPing = () => {
                const packet = { id: myId, name: myName, avatar: myAvatar, region: myRegion, isMuted: isMuted, timestamp: Date.now() };
                mqttClient.publish(`lobby/${ROOM_ID}/presence`, JSON.stringify(packet));
            };
            sendPing();
            setInterval(sendPing, 3000); 
            setInterval(flushDeadPeers, 8000); 
        }

        function handlePresence(peerInfo) {
            if (peerInfo.id === myId) return;
            if (!activePeers[peerInfo.id] && localStream) {
                let call = peer.call(peerInfo.id, localStream);
                handleIncomingCall(call);
            }
            activePeers[peerInfo.id] = peerInfo;
            renderMemberList();
        }

        function flushDeadPeers() {
            const now = Date.now();
            let changed = false;
            for (let id in activePeers) {
                if (now - activePeers[id].timestamp > 10000) { 
                    delete activePeers[id];
                    changed = true;
                }
            }
            if (changed) renderMemberList();
        }

        function renderMemberList() {
            const listContainer = document.getElementById("member-list");
            listContainer.innerHTML = "";
            listContainer.appendChild(createMemberRow(myId, myName, myAvatar, myRegion, isMuted, true));
            
            let count = 1;
            for (let id in activePeers) {
                let p = activePeers[id];
                listContainer.appendChild(createMemberRow(p.id, p.name, p.avatar, p.region, p.isMuted, false));
                count++;
            }
            document.getElementById("member-count").innerText = count;
        }

        function createMemberRow(id, name, avatar, region, isPeerMuted, isSelf) {
            const row = document.createElement("div");
            row.className = "flex items-center justify-between p-1.5 hover:bg-[#35373c] rounded text-xs";
            row.innerHTML = `
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="relative flex-shrink-0">
                        <img src="${avatar}" class="w-7 h-7 rounded-full object-cover">
                        <div class="absolute bottom-0 right-0 w-2 h-2 ${isPeerMuted ? 'bg-red-500':'bg-[#23a55a]'} rounded-full border border-[#2b2d31]"></div>
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="text-[#dbdee1] font-medium truncate">${name}</span>
                        <span class="text-gray-500 text-[9px] truncate">${region}</span>
                    </div>
                </div>
                ${!isSelf ? `
                    <button onclick="remoteMute('${id}', event)" class="w-6 h-6 bg-red-600/20 active:bg-red-600 text-red-500 active:text-white rounded flex items-center justify-center transition text-[10px]" title="强制静音他">
                        <i class="fa-solid fa-microphone-slash"></i>
                    </button>
                ` : '<span class="text-[9px] text-gray-500 bg-gray-700 px-1 rounded flex-shrink-0">自己</span>'}
            `;
            return row;
        }

        // 任何人静音任何人（点击时阻止事件冒泡，防止关闭抽屉）
        function remoteMute(targetId, event) {
            if(event) event.stopPropagation();
            const cmdPacket = { type: "FORCE_MUTE" };
            mqttClient.publish(`lobby/${ROOM_ID}/cmd/${targetId}`, JSON.stringify(cmdPacket));
        }

        function handleCommand(cmd) {
            if (cmd.type === "FORCE_MUTE") {
                alert(`⚠️ 秩序提示：你已被群友强制执行静音关闭！`);
                if (!isMuted) toggleLocalMic(); 
            }
        }

        function handleIncomingCall(call) {
            call.on('stream', (remoteStream) => {
                let existingAudio = document.getElementById(`audio-${call.peer}`);
                if (!existingAudio) {
                    const audioEl = document.createElement('audio');
                    audioEl.id = `audio-${call.peer}`;
                    audioEl.srcObject = remoteStream;
                    audioEl.autoplay = true;
                    document.getElementById('remote-audios').appendChild(audioEl);
                }
            });
        }

        function toggleLocalMic() {
            if (!localStream) return;
            let audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                
                const icon = document.getElementById("mic-icon");
                icon.className = isMuted ? "fa-solid fa-microphone-slash text-red-500" : "fa-solid fa-microphone text-xs";
                
                const packet = { id: myId, name: myName, avatar: myAvatar, region: myRegion, isMuted: isMuted, timestamp: Date.now() };
                mqttClient.publish(`lobby/${ROOM_ID}/presence`, JSON.stringify(packet));
            }
        }

        // --- 消息处理 ---
        function sendTextMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;

            const msgPacket = { id: myId, name: myName, avatar: myAvatar, region: myRegion, type: "text", content: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
            mqttClient.publish(`lobby/${ROOM_ID}/chat`, JSON.stringify(msgPacket));
            input.value = "";
        }

        function sendImageMessage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const msgPacket = { id: myId, name: myName, avatar: myAvatar, region: myRegion, type: "image", content: event.target.result, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                mqttClient.publish(`lobby/${ROOM_ID}/chat`, JSON.stringify(msgPacket));
            };
            reader.readAsDataURL(file);
        }

        function displayMessage(msg) {
            const chatZone = document.getElementById("chat-messages");
            const msgRow = document.createElement("div");
            msgRow.className = "flex items-start gap-2.5 hover:bg-[#2e3035] p-1 px-1.5 rounded transition";

            let contentHtml = "";
            if (msg.type === "text") {
                contentHtml = `<p class="text-[#dbdee1] text-xs sm:text-sm break-all mt-0.5">${escapeHtml(msg.content)}</p>`;
            } else if (msg.type === "image") {
                contentHtml = `<img src="${msg.content}" class="max-w-[200px] sm:max-w-xs max-h-48 rounded border border-gray-700 mt-1 object-contain" onclick="window.open(this.src)">`;
            }

            msgRow.innerHTML = `
                <img src="${msg.avatar}" class="w-8 h-8 rounded-full object-cover flex-shrink-0 mt-0.5">
                <div class="flex flex-col min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-white font-semibold text-xs sm:text-sm truncate max-w-[120px]">${msg.name}</span>
                        <span class="text-[9px] text-gray-400 bg-gray-800 px-1 rounded">${msg.region}</span>
                        <span class="text-[10px] text-gray-500 font-light">${msg.time}</span>
                    </div>
                    ${contentHtml}
                </div>
            `;
            chatZone.appendChild(msgRow);
            chatZone.scrollTop = chatZone.scrollHeight; 
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
