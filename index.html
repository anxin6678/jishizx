<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 无服务器语音聊天室</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h3 { margin-top: 0; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; border: none; border-radius: 5px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        button.danger { background: #dc3545; }
        button.success { background: #28a745; }
        #chat-box { height: 300px; border: 1px solid #eee; border-radius: 5px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 8px; line-height: 1.4; }
        .msg.me { color: var(--primary); text-align: right; }
        .msg.peer { color: #d63384; }
        .msg.system { color: #6c757d; font-size: 0.9em; text-align: center; font-style: italic; }
        .peer-list { margin-top: 10px; font-size: 0.9em; color: #555; }
        #audio-container { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎙️ P2P 网页语音聊天</h1>
        <p>你的专属固定 ID: <strong id="my-id" style="color: var(--primary); user-select: all; font-size: 1.2em;">读取中...</strong></p>
        <p style="font-size: 0.85em; color: #666;">（将此 ID 发给你的朋友，或者输入朋友的 ID 进行连接）</p>
        
        <div class="flex">
            <button id="btn-mic" class="danger">1. 开启麦克风 (必须先开启)</button>
        </div>
    </div>

    <div class="card">
        <h3>🔗 连接到好友</h3>
        <div class="flex">
            <input type="text" id="target-id" placeholder="输入朋友的 ID...">
            <button id="btn-connect" onclick="connectToPeer()">2. 连接并呼叫</button>
        </div>
        <div class="peer-list" id="active-peers">当前连接: 无</div>
    </div>

    <div class="card">
        <h3>💬 聊天室</h3>
        <div id="chat-box"></div>
        <div class="flex">
            <input type="text" id="msg-input" placeholder="输入文字消息..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <div id="audio-container"></div>

    <script>
        // === 1. 尝试从浏览器的本地存储中读取之前保存的 ID ===
        let mySavedId = localStorage.getItem('my_fixed_peer_id');

        // === 2. 如果没有找到（说明是第一次打开网页）===
        if (!mySavedId) {
            // 弹窗让用户自己设定一个 ID
            mySavedId = prompt("欢迎来到语音聊天室！\n\n请为你自己设定一个【固定的通讯 ID】\n（建议使用英文、拼音或数字，例如：zhangsan88）:");
            
            // 如果用户点了取消或者什么都没填，就给他生成一个随机的作为备用
            if (!mySavedId || mySavedId.trim() === '') {
                mySavedId = 'user_' + Math.random().toString(36).substr(2, 6);
                alert("你没有输入自定义 ID，系统已为你随机分配：" + mySavedId);
            }
            
            // 将这个 ID 永久保存在浏览器中
            localStorage.setItem('my_fixed_peer_id', mySavedId.trim());
        }

        // === 3. 使用固定的 ID 初始化 PeerJS ===
        const peer = new Peer(mySavedId);
        
        let myId = '';
        let localStream = null;
        
        // 存储连接对象，支持多人
        const dataConns = {}; 
        const mediaCalls = {}; 

        // DOM 元素
        const chatBox = document.getElementById('chat-box');
        const activePeersDiv = document.getElementById('active-peers');
        const audioContainer = document.getElementById('audio-container');

        // 成功连接服务器，获取自身 ID
        peer.on('open', (id) => {
            myId = id;
            document.getElementById('my-id').innerText = id;
            logSystem('已连接网络！你的固定 ID 是: ' + id);
        });

        // 监听如果 ID 被别人占用了的错误
        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert('糟糕，这个 ID [' + mySavedId + '] 当前正被别人使用！\n页面将刷新，请重新设置一个新的 ID。');
                // 清除旧的冲突 ID，刷新页面让用户重新输入
                localStorage.removeItem('my_fixed_peer_id');
                location.reload();
            } else {
                logSystem('网络错误: ' + err.type);
                console.error(err);
            }
        });

        // 开启麦克风
        document.getElementById('btn-mic').addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const btn = document.getElementById('btn-mic');
                btn.className = 'success';
                btn.innerText = '麦克风已开启 ✅';
                logSystem('麦克风已就绪。');
            } catch (err) {
                alert('无法访问麦克风，请检查浏览器权限限制。');
            }
        });

        // 接收他人的文字连接请求
        peer.on('connection', (conn) => {
            setupDataConnection(conn);
        });

        // 接收他人的语音呼叫
        peer.on('call', (call) => {
            if (!localStream) {
                logSystem('收到语音呼叫，但你未开启麦克风，无法接听。');
                return;
            }
            call.answer(localStream);
            setupMediaCall(call);
        });

        // 主动连接其他用户 (文字+语音)
        function connectToPeer() {
            const targetId = document.getElementById('target-id').value.trim();
            if (!targetId || targetId === myId) return alert('请输入有效的他人 ID');
            if (!localStream) return alert('请先开启麦克风再进行连接！');

            const conn = peer.connect(targetId);
            setupDataConnection(conn);

            const call = peer.call(targetId, localStream);
            setupMediaCall(call);
            
            document.getElementById('target-id').value = '';
        }

        // ================= 工具函数 =================
        function setupDataConnection(conn) {
            conn.on('open', () => {
                dataConns[conn.peer] = conn;
                updatePeerList();
                logSystem(`已与用户 [${conn.peer}] 建立连接`);
            });

            conn.on('data', (data) => {
                logMessage(`[${conn.peer}]: ${data}`, 'peer');
            });

            conn.on('close', () => {
                delete dataConns[conn.peer];
                updatePeerList();
                logSystem(`用户 [${conn.peer}] 断开连接`);
            });
        }

        function setupMediaCall(call) {
            call.on('stream', (remoteStream) => {
                if (document.getElementById('audio-' + call.peer)) return;
                const audioElement = document.createElement('audio');
                audioElement.id = 'audio-' + call.peer;
                audioElement.srcObject = remoteStream;
                audioElement.autoplay = true;
                audioContainer.appendChild(audioElement);
            });

            call.on('close', () => {
                const audioEl = document.getElementById('audio-' + call.peer);
                if (audioEl) audioEl.remove();
            });
            mediaCalls[call.peer] = call;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            logMessage(`[我]: ${text}`, 'me');
            for (let peerId in dataConns) {
                dataConns[peerId].send(text);
            }
            input.value = '';
        }

        function updatePeerList() {
            const ids = Object.keys(dataConns);
            activePeersDiv.innerText = ids.length ? `当前连接: ${ids.join(', ')}` : '当前连接: 无';
        }

        function logMessage(msg, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = msg;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function logSystem(msg) {
            logMessage(`— ${msg} —`, 'system');
        }
    </script>
</body>
</html>
