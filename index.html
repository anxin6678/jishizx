<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5ed">
  <title>手工活咨询 | 手作</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #482d3e;
      background: #fff5ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 38px 20px 48px;
      background:
        radial-gradient(circle at 8% 8%, #ffe1ce 0, transparent 30%),
        radial-gradient(circle at 92% 38%, #eadcff 0, transparent 32%),
        linear-gradient(160deg, #fff9f3, #fff0f3 56%, #f2eaff);
    }

    .content {
      width: min(100%, 560px);
      margin: 0 auto;
      text-align: center;
    }

    .label {
      display: inline-block;
      margin: 0 0 18px;
      padding: 8px 17px;
      border: 1px solid #f4c9bd;
      border-radius: 999px;
      color: #b94a38;
      background: rgba(255, 255, 255, .75);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      color: #512e51;
      font-size: clamp(38px, 10vw, 52px);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: .04em;
    }

    h1 span {
      color: #e85f4f;
    }

    .intro {
      margin: 14px 0 25px;
      color: #705467;
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 800;
      line-height: 1.6;
    }

    .card {
      padding: 26px 24px 28px;
      border: 1px solid #fff;
      border-radius: 28px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 18px 50px rgba(126, 67, 94, .13);
    }

    .card h2 {
      margin: 0;
      color: #623761;
      font-size: clamp(25px, 6.5vw, 32px);
      font-weight: 900;
      line-height: 1.4;
    }

    .card p {
      margin: 8px 0 20px;
      color: #765d70;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.6;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .card .code {
      width: min(100%, 329px);
      margin: 0 auto;
    }

    .showcase {
      margin-top: 22px;
    }

    .save {
      display: block;
      width: min(100%, 400px);
      margin: 22px auto 0;
      padding: 15px 20px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(100deg, #e95f50, #d74f72);
      box-shadow: 0 8px 18px rgba(211, 76, 91, .25);
      font-size: 20px;
      font-weight: 800;
      text-decoration: none;
    }

    .save:hover {
      background: #c8495e;
    }

    .save:focus-visible {
      outline: 3px solid #623761;
      outline-offset: 4px;
    }

    .steps {
      margin: 22px 0 0;
      padding: 17px 18px;
      border: 1px solid rgba(232, 188, 191, .65);
      border-radius: 18px;
      color: #6f5366;
      background: rgba(255, 255, 255, .6);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.7;
    }

    .steps strong {
      color: #b6414d;
    }

    .notice {
      margin: 17px 0 0;
      color: #806b7a;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .page {
        padding: 32px 18px 40px;
      }

      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="content">
      <header>
        <p class="label">手作 · 手工活咨询</p>
        <h1>想了解<span>手工活</span>？</h1>
        <p class="intro">微信扫一扫<br>了解手工活详情</p>
      </header>

      <section class="card" aria-labelledby="scan-title">
        <h2 id="scan-title">扫码进入咨询</h2>
        <p>识别下方的小程序码</p>
        <picture>
          <source srcset="consultation-code-v2.webp" type="image/webp">
          <img class="code" src="consultation-code-v2.png" width="329" height="328" alt="微信小程序咨询码" fetchpriority="high">
        </picture>
        <a class="save" href="consultation-code-v2.png" download="手工活咨询码.png">保存图片，微信扫码</a>
      </section>

      <p class="steps"><strong>手机这样操作</strong><br>保存图片 → 打开微信扫一扫<br>从相册选择图片，识别咨询码</p>
      <section class="card showcase" aria-labelledby="showcase-title">
        <h2 id="showcase-title">手工作品展示</h2>
        <p>了解手工制作和作品</p>
        <picture>
          <source srcset="showcase.webp" type="image/webp">
          <img src="showcase.jpg" width="648" height="864" alt="手工制作场景与玩偶、饰品等作品展示" loading="lazy" decoding="async">
        </picture>
      </section>
      <p class="notice">具体工作内容及合作方式，请扫码咨询了解。</p>
    </div>
  </main>
</body>
</html>
